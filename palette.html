<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness Builder</title>
  <style>
    :root { font: 13px system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #f4f5f6; color: #202428; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; }
    h2 { margin: 22px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
    button { border: 1px solid #7778; border-radius: 4px; padding: 7px 11px; color: #202428; cursor: pointer; }
    #create { width: 100%; margin-top: 16px; background: #1777c8; color: white; border-color: #1777c8; }
    #notice { min-height: 18px; margin: 10px 0 0; color: #287d28; }
    #harnesses { display: grid; gap: 8px; }
    #harnesses > button { width: 100%; padding: 10px; text-align: left; background: transparent; }
    .harness strong, .harness span { display: block; }
    .harness span { margin-top: 4px; opacity: .72; font-size: 12px; }
    #harnesses > button[data-status="damaged"] { border-color: #b44242; }
    #details { margin-top: 16px; padding-top: 12px; border-top: 1px solid #7775; }
    #details dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; }
    #details dt { opacity: .7; }
    #details dd { margin: 0; overflow-wrap: anywhere; }
    .empty { opacity: .65; }
  </style>
</head>
<body>
  <header><h1>Harness Builder</h1><button id="refresh" type="button">Refresh</button></header>
  <button id="create" type="button">Create New Harness</button>
  <p id="notice" role="status"></p>
  <h2>Existing Harnesses</h2>
  <div id="harnesses"><p class="empty">Loading…</p></div>
  <section id="details" hidden></section>
  <script>
    const list = document.getElementById("harnesses");
    const details = document.getElementById("details");
    const notice = document.getElementById("notice");

    function showDetails(harness) {
      const rows = harness.status === "damaged"
        ? [["Component", harness.componentName], ["Status", "Damaged metadata"], ["Error", harness.error]]
        : [["Component", harness.componentName], ["Definition", harness.definitionName],
           ["Routing", harness.routingMode], ["Wires", harness.wireCount],
           ["Connections", harness.connectionCount], ["Controls", harness.controlCount],
           ["Profiles", harness.profileCount], ["ID", harness.harnessId]];
      details.replaceChildren();
      const heading = document.createElement("h2");
      heading.textContent = "Harness Details";
      const description = document.createElement("dl");
      rows.forEach(([label, value]) => {
        const term = document.createElement("dt");
        const definition = document.createElement("dd");
        term.textContent = label;
        definition.textContent = value ?? "";
        if (label === "Error") definition.style.color = "#b44242";
        description.append(term, definition);
      });
      details.append(heading, description);
      details.hidden = false;
    }

    function render(state) {
      notice.textContent = state.notice || "";
      list.replaceChildren();
      if (!state.harnesses.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No procedural harnesses in this design.";
        list.append(empty);
        details.hidden = true;
        return;
      }
      state.harnesses.forEach((harness) => {
        const button = document.createElement("button");
        const name = document.createElement("strong");
        const summary = document.createElement("span");
        button.type = "button";
        button.className = "harness";
        button.dataset.status = harness.status;
        name.textContent = harness.componentName;
        summary.textContent = harness.status === "damaged"
          ? "Metadata could not be loaded"
          : `${harness.routingMode} · ${harness.wireCount} wires · ${harness.status}`;
        button.append(name, summary);
        button.addEventListener("click", () => showDetails(harness));
        list.append(button);
      });
    }

    function waitForFusionHost() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const timer = window.setInterval(() => {
          const fusionHost = window["adsk"];
          if (fusionHost && fusionHost.fusionSendData) {
            window.clearInterval(timer);
            resolve(fusionHost);
            return;
          }
          attempts += 1;
          if (attempts >= 50) {
            window.clearInterval(timer);
            reject(new Error("Fusion did not initialize the palette bridge."));
          }
        }, 100);
      });
    }

    async function send(action) {
      const fusionHost = await waitForFusionHost();
      const response = await fusionHost.fusionSendData(action, "{}");
      return JSON.parse(response);
    }

    async function refresh() {
      try { render(await send("get_state")); }
      catch (error) { notice.textContent = error.message; notice.style.color = "#b44242"; }
    }

    document.getElementById("refresh").addEventListener("click", refresh);
    document.getElementById("create").addEventListener("click", async () => {
      notice.style.color = "";
      notice.textContent = "Opening Create Harness…";
      try { await send("create_harness"); }
      catch (error) { notice.textContent = error.message; notice.style.color = "#b44242"; }
    });
    window.fusionJavaScriptHandler = { handle(action, data) {
      if (action === "state") render(JSON.parse(data));
      return "OK";
    }};
    refresh();
  </script>
</body>
</html>
