<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness Builder</title>
  <!-- Dynamic elements use these classes at runtime. -->
  <!--suppress CssUnusedSymbol -->
  <style>
    :root {
      color-scheme: light;
      font: 13px system-ui, sans-serif;
      --accent: #1777c8;
      --border: #c8cdd2;
      --muted: #68717a;
      --surface: #fff;
      --surface-subtle: #f4f5f6;
      --text: #202428;
      --danger: #b44242;
      --success: #287d28;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      border: 4px solid var(--surface-subtle);
      min-height: 100vh;
      background: var(--surface-subtle);
      color: var(--text);
    }
    .wire-details { display: grid; gap: 8px; }
    .wire-options { border: 1px solid var(--border); border-radius: 6px; width: 320px; max-width: 90vw; }
    .material-options { width: 430px; max-height: 88vh; overflow-x: hidden; overflow-y: auto; }
    .wire-options::backdrop { background: #0005; }
    .wire-options form { display: grid; gap: 12px; }
    .wire-options label { display: grid; gap: 8px; }
    .wire-options label.apply-existing { display: flex; align-items: center; gap: 8px; }
    .icon-button.options-button { width: auto; padding: 0 6px; }
    .wire-options .actions { display: flex; justify-content: flex-end; gap: 8px; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .app-header {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    h1 { margin: 0; font-size: 17px; }
    h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
    h3 { margin: 0; font-size: 13px; }
    .button {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 10px;
      background: var(--surface);
    }
    .button:hover { border-color: #9199a1; background: #f8f9fa; }
    .button:disabled { cursor: default; opacity: .5; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .button.compact { padding: 5px 8px; }
    main { padding: 14px; }
    #notice {
      height: 108px;
      margin: 0 0 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 9px;
      overflow-y: auto;
      background: var(--surface);
      color: var(--text);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-wrap;
    }
    #notice:empty::before { content: "Events will appear here."; color: var(--muted); }
    .notice-entry + .notice-entry { margin-top: 5px; }
    .notice-entry.error { color: var(--danger); }
    .library-actions { display: grid; gap: 10px; }
    #create { width: 100%; }
    .filter {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--text);
    }
    .section-label {
      margin: 20px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #harnesses { display: grid; gap: 8px; }
    .harness-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 10px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 11px;
      background: var(--surface);
      text-align: left;
    }
    .harness-card:hover { border-color: var(--accent); }
    .harness-card[data-status="damaged"] { border-color: var(--danger); }
    .harness-card strong { overflow-wrap: anywhere; }
    .harness-card .summary { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
    .status {
      align-self: start;
      border-radius: 999px;
      padding: 2px 7px;
      background: #e8edf1;
      color: #48525b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .status[data-status="valid"] { background: #dff1df; color: #226b22; }
    .status[data-status="damaged"] { background: #f5dfdf; color: #8e3030; }
    .editor-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .editor-heading { display: grid; gap: 5px; margin-bottom: 14px; }
    .editor-heading .meta { color: var(--muted); }
    .overview {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 5px 12px;
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    .overview dt { color: var(--muted); }
    .overview dd { margin: 0; overflow-wrap: anywhere; }
    details {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 1ch;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▸"; color: var(--muted); }
    details[open] summary::after { content: "▾"; }
    summary > span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .count { color: var(--muted); font-size: 11px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
    .section-content { display: grid; gap: 8px; padding: 0 11px 11px; }
    .item-meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .wire-filter { margin-bottom: 2px; }
    .material-field { display: grid; gap: 6px; }
    .material-options form, .material-options label, .material-field,
    .appearance-library-controls, .stripe-row, .stripe-values { min-width: 0; }
    .material-options input:not([type="checkbox"]):not([type="color"]),
    .material-options select, .material-options textarea {
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }
    .material-options input.filter, .material-options select {
      box-sizing: border-box;
      min-height: 38px;
      height: 38px;
      padding-top: 8px;
      padding-bottom: 8px;
      line-height: 20px;
    }
    .material-field-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .material-field-heading label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
    .material-color-row { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
    .material-color-row input[type="color"] { width: 46px; height: 34px; padding: 2px; }
    .appearance-source { display: grid; gap: 6px; }
    .appearance-library-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .autocomplete { position: relative; }
    .autocomplete-suggestions { position: absolute; z-index: 20; top: 100%; left: 0; right: 0; max-height: 180px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 4px 4px; box-shadow: 0 5px 12px #0003; }
    .autocomplete-suggestions[hidden] { display: none; }
    .autocomplete-suggestions button { display: block; width: 100%; min-height: 34px; padding: 6px 9px; border: 0; background: var(--surface); text-align: left; }
    .autocomplete-suggestions button:hover, .autocomplete-suggestions button:focus { background: var(--surface-subtle); }
    .stripe-list { display: grid; gap: 7px; }
    .stripe-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 6px; align-items: end; border: 1px solid var(--border); border-radius: 4px; padding: 7px; }
    .stripe-row input[type="color"] { width: 38px; height: 34px; padding: 2px; }
    .stripe-values { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .stripe-values label { gap: 3px; color: var(--muted); font-size: 11px; }
    .material-options textarea { min-height: 64px; resize: vertical; }
    .nested-details { margin-top: 0; background: var(--surface-subtle); }
    .nested-details + .nested-details { margin-top: 6px; }
    .nested-details > summary { padding: 8px 9px; font-size: 12px; }
    .nested-details > .section-content { padding: 0 9px 9px; }
    .sequence { display: grid; gap: 4px; }
    .member-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      border: 1px solid #e1e4e7;
      border-radius: 4px;
      padding: 3px 4px 3px 7px;
      background: var(--surface);
    }
    .member-row.missing { border-color: var(--danger); background: #fff8f8; }
    .sequence-position { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; min-width: 3ch; }
    .member-row[data-reorder] { grid-template-columns: auto minmax(0, 1fr) auto; cursor: grab; position: relative; touch-action: none; user-select: none; }
    .member-row[data-dragging="true"] { opacity: 0.45; cursor: grabbing; }
    .member-row[data-drop]::after {
      content: ""; position: absolute; left: 0; right: 0; height: 4px;
      background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 2;
    }
    .member-row[data-drop="before"]::after { top: -5px; }
    .member-row[data-drop="after"]::after { bottom: -5px; }
    .member-reference {
      min-width: 0;
      border: 0;
      padding: 3px 0;
      background: transparent;
      color: inherit;
      overflow: hidden;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .member-reference:hover { color: var(--accent); }
    .member-actions { display: flex; gap: 3px; }
    .icon-button {
      min-width: 25px;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 5px;
      background: var(--surface);
    }
    .icon-button:hover { border-color: var(--accent); }
    .icon-button.danger { color: var(--danger); }
    .wire-route {
      display: grid;
      gap: 8px;
      border: 1px solid #dde1e5;
      border-radius: 5px;
      padding: 9px;
      background: var(--surface-subtle);
    }
    .wire-route + .wire-route { margin-top: 8px; }
    .route-flow { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding-bottom: 2px; }
    .route-node {
      flex: 0 0 auto;
      max-width: 170px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 8px;
      background: var(--surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button.route-node:hover { border-color: var(--accent); color: var(--accent); }
    button.route-node[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
    .route-node.pathway { max-width: none; border-color: #9ebed8; background: #edf6fd; }
    .route-node.missing { border-color: var(--danger); background: #fff8f8; color: var(--danger); }
    .route-arrow { flex: 0 0 auto; color: var(--muted); }
    .end-editor {
      display: grid;
      gap: 7px;
      border: 1px solid #b9cddd;
      border-radius: 5px;
      padding: 8px;
      background: #f5faff;
    }
    .end-editor-heading { display: flex; justify-content: space-between; gap: 8px; }
    .occupancy { display: grid; gap: 4px; }
    .validation-list { margin: 0; padding-left: 20px; }
    .validation-list li + li { margin-top: 6px; }
    .validation-list.errors { color: var(--danger); }
    .relationship-audit {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #a9c9a9;
      border-radius: 5px;
      padding: 8px 10px;
      background: #f2faf2;
      color: #226b22;
    }
    .relationship-audit::before { content: "✓"; font-weight: 800; }
    .relationship-audit.findings {
      border-color: #d9a4a4;
      background: #fff7f7;
      color: var(--danger);
    }
    .relationship-audit.findings::before { content: "!"; }
    .relationship-map { display: grid; gap: 9px; }
    .relationship-map-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }
    .relationship-map-settings {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .relationship-map-settings input { width: 64px; padding: 5px 7px; }
    .relationship-map-summary { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .relationship-map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 14px;
      color: var(--muted);
      font-size: 11px;
    }
    .relationship-map-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .relationship-map-legend i { display: inline-block; width: 11px; height: 11px; }
    .relationship-map-legend .connection { border: 1px solid #6887a0; border-radius: 3px; background: #eef5fa; }
    .relationship-map-legend .pathway { border: 1px solid #b07b2e; transform: rotate(45deg); background: #fff7e8; }
    .relationship-map-legend .wire { width: 18px; height: 5px; border-radius: 3px; background: var(--accent); }
    .relationship-map-viewport {
      max-height: 430px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: auto;
      background: linear-gradient(#fff, #fbfcfd);
    }
    .relationship-pathway-stack { display: grid; gap: 10px; min-width: 760px; padding: 10px; }
    .relationship-pathway-card {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) 54px 170px 54px minmax(210px, 1fr);
      align-items: stretch;
      gap: 4px;
      border: 1px solid #d5dde4;
      border-radius: 7px;
      padding: 10px;
      background: var(--surface);
    }
    .relationship-end-list {
      align-self: center;
      margin: 0;
      border: 1px solid #d9e1e7;
      border-radius: 5px;
    }
    .relationship-end-list[open] {
      align-self: stretch;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .relationship-end-list > summary {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 8px;
      cursor: pointer;
      font-weight: 700;
      background: var(--surface-subtle);
    }
    .relationship-end-items {
      display: grid;
      align-content: space-around;
      gap: 5px;
      padding: 7px;
    }
    .relationship-end-entry {
      width: 100%;
      display: grid;
      gap: 2px;
      border: 1px solid #9eb5c6;
      border-radius: 5px;
      padding: 6px 7px;
      text-align: left;
      background: #eef5fa;
      color: var(--text);
      cursor: pointer;
    }
    .relationship-end-entry:hover, .relationship-end-entry:focus { border-color: var(--accent); }
    .relationship-end-entry small { color: var(--muted); }
    .relationship-pathway-hub {
      align-self: center;
      min-height: 92px;
      display: grid;
      place-content: center;
      gap: 5px;
      border: 1px solid #b07b2e;
      border-radius: 7px;
      padding: 10px;
      background: #fff7e8;
      text-align: center;
      color: var(--text);
      cursor: pointer;
    }
    .relationship-pathway-hub strong { font-size: 12px; }
    .relationship-pathway-hub small { color: var(--muted); }
    .relationship-connector {
      align-self: stretch;
      width: 54px;
      min-height: 92px;
      overflow: visible;
      pointer-events: none;
    }
    .relationship-connector path {
      fill: none;
      stroke: #7b9ab2;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }
    .wire-relationship-graphic {
      border: 1px solid #d9e1e7;
      border-radius: 5px;
      overflow-x: auto;
      background: var(--surface);
    }
    .relationship-map-svg { display: block; min-width: 100%; }
    .relationship-route-row { cursor: pointer; }
    .relationship-route-row .row-background { fill: transparent; }
    .relationship-route-row:hover .row-background,
    .relationship-route-row:focus .row-background { fill: #edf6fd; }
    .relationship-route-row:focus { outline: none; }
    .relationship-route-label { fill: var(--text); font-size: 12px; font-weight: 700; }
    .relationship-route-meta { fill: var(--muted); font-size: 10px; }
    .relationship-link { stroke-linecap: round; }
    .relationship-node.connection { fill: #eef5fa; stroke: #6887a0; }
    .relationship-node.pathway { fill: #fff7e8; stroke: #b07b2e; }
    .relationship-node.missing { fill: #fff2f2; stroke: var(--danger); stroke-dasharray: 3 2; }
    .relationship-node-label { fill: var(--text); font-size: 10px; text-anchor: middle; }
    .relationship-node-kind { fill: var(--muted); font-size: 8px; text-anchor: middle; text-transform: uppercase; }
    .relationship-map-empty { padding: 18px; text-align: center; }
    .empty { margin: 0; color: var(--muted); }
    .error-panel {
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: 11px;
      background: #fff8f8;
      color: #7e2929;
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Harness Builder</h1>
    <button id="refresh" class="button compact" type="button">Refresh</button>
  </header>
  <main>
    <div id="notice" role="log" aria-label="Harness events" aria-live="polite"></div>
    <section id="library-view" aria-label="Harness library">
      <div class="library-actions">
        <button id="create" class="button primary" type="button">Create New Harness</button>
        <input id="harness-filter" class="filter" type="search"
               aria-label="Filter harnesses" placeholder="Filter harnesses…"
               autocomplete="off" spellcheck="false">
      </div>
      <p class="section-label">Existing Harnesses</p>
      <div id="harnesses"><p class="empty">Loading…</p></div>
    </section>
    <section id="editor-view" aria-label="Harness editor" hidden>
      <div class="editor-nav">
        <button id="back" class="button compact" type="button">← All Harnesses</button>
        <button id="add-pathway" class="button compact primary" type="button">Add Pathway</button>
        <button id="add-wires" class="button compact primary" type="button">Add Wire Pairs</button>
        <button id="preview-routes" class="button compact primary" type="button">Preview Routes</button>
        <button id="generate-solids" class="button compact primary" type="button">Generate/Rebuild Solids</button>
        <button id="clear-solids" class="button compact" type="button">Clear Solids</button>
        <button id="interpolation-defaults" class="button compact" type="button">Defaults</button>
        <button id="material-defaults" class="button compact" type="button">Wire Materials</button>
        <button id="clear-preview" class="button compact" type="button">Clear Preview</button>
        <button id="create-from-editor" class="button compact" type="button">New Harness</button>
      </div>
      <div id="editor"></div>
    </section>
  </main>
  <script>
    const ui = {
      back: document.getElementById("back"),
      addPathway: document.getElementById("add-pathway"),
      addWires: document.getElementById("add-wires"),
      previewRoutes: document.getElementById("preview-routes"),
      clearPreview: document.getElementById("clear-preview"),
      generateSolids: document.getElementById("generate-solids"),
      clearSolids: document.getElementById("clear-solids"),
      defaults: document.getElementById("interpolation-defaults"),
      materialDefaults: document.getElementById("material-defaults"),
      create: document.getElementById("create"),
      createFromEditor: document.getElementById("create-from-editor"),
      editor: document.getElementById("editor"),
      editorView: document.getElementById("editor-view"),
      harnessFilter: document.getElementById("harness-filter"),
      libraryView: document.getElementById("library-view"),
      list: document.getElementById("harnesses"),
      notice: document.getElementById("notice"),
      refresh: document.getElementById("refresh"),
    };

    function readSession(key) {
      try { return window.sessionStorage.getItem(key); }
      catch (_error) { return null; }
    }

    function writeSession(key, value) {
      try { window.sessionStorage.setItem(key, value); }
      catch (_error) { /* Palette storage is an optional convenience. */ }
    }

    function removeSession(key) {
      try { window.sessionStorage.removeItem(key); }
      catch (_error) { /* Palette storage is an optional convenience. */ }
    }

    let currentState = { harnesses: [], notice: "" };
    let selectedHarnessKey = readSession("wireBundler.selectedHarness") || "";
    const routeFilters = new Map();
    const relationshipFilters = new Map();
    const relationshipEndListOverrides = new Map();
    const DEFAULT_RELATIONSHIP_COLLAPSE_LIMIT = 7;
    const MIN_RELATIONSHIP_COLLAPSE_LIMIT = 1;
    const MAX_RELATIONSHIP_COLLAPSE_LIMIT = 999;
    const storedExpandedSections = readSession("wireBundler.expandedSections");
    let hasStoredExpansionState = storedExpandedSections !== null;
    let expandedSectionIds = [];
    try {
      expandedSectionIds = JSON.parse(storedExpandedSections || "[]");
      if (!Array.isArray(expandedSectionIds)) expandedSectionIds = [];
    } catch (_error) {
      expandedSectionIds = [];
    }
    const expandedSections = new Set(expandedSectionIds);

    function harnessKey(harness) {
      return harness.harnessId || `component:${harness.componentName}`;
    }

    function relationshipCollapseStorageKey(harness) {
      return `wireBundler.relationshipCollapseLimit:${harnessKey(harness)}`;
    }

    function clampRelationshipCollapseLimit(value) {
      const parsed = Math.round(Number(value));
      if (!Number.isFinite(parsed)) return DEFAULT_RELATIONSHIP_COLLAPSE_LIMIT;
      return Math.min(
        MAX_RELATIONSHIP_COLLAPSE_LIMIT,
        Math.max(MIN_RELATIONSHIP_COLLAPSE_LIMIT, parsed),
      );
    }

    function relationshipCollapseLimit(harness) {
      const stored = readSession(relationshipCollapseStorageKey(harness));
      return stored === null
        ? DEFAULT_RELATIONSHIP_COLLAPSE_LIMIT
        : clampRelationshipCollapseLimit(stored);
    }

    function emptyMessage(text) {
      const paragraph = document.createElement("p");
      paragraph.className = "empty";
      paragraph.textContent = text;
      return paragraph;
    }

    function statusBadge(harness) {
      const badge = document.createElement("span");
      badge.className = "status";
      badge.dataset.status = harness.status;
      badge.textContent = harness.status;
      return badge;
    }

    function renderLibrary() {
      const query = ui.harnessFilter.value.trim().toLocaleLowerCase();
      const harnesses = currentState.harnesses.filter((harness) => {
        const searchable = `${harness.componentName} ${harness.routingMode || ""} ${harness.status}`;
        return searchable.toLocaleLowerCase().includes(query);
      });
      ui.list.replaceChildren();
      if (!harnesses.length) {
        const message = currentState.harnesses.length
          ? "No harnesses match this filter."
          : "No procedural harnesses in this design.";
        ui.list.append(emptyMessage(message));
        return;
      }
      harnesses.forEach((harness) => {
        const button = document.createElement("button");
        const name = document.createElement("strong");
        const summary = document.createElement("span");
        button.type = "button";
        button.className = "harness-card";
        button.dataset.status = harness.status;
        name.textContent = harness.componentName;
        summary.className = "summary";
        summary.textContent = harness.status === "damaged"
          ? "Metadata could not be loaded"
          : `${harness.routingMode} · ${harness.wires.length} wires`;
        button.append(name, statusBadge(harness), summary);
        button.addEventListener("click", () => openHarness(harnessKey(harness)));
        ui.list.append(button);
      });
    }

    function editorSection(id, title, count, content, openByDefault = false) {
      const section = document.createElement("details");
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      const counter = document.createElement("span");
      section.dataset.section = id;
      section.open = expandedSections.has(id) || (openByDefault && !hasStoredExpansionState);
      label.textContent = title;
      counter.className = "count";
      counter.textContent = count;
      summary.append(label, counter);
      section.append(summary, content);
      section.addEventListener("toggle", () => {
        hasStoredExpansionState = true;
        if (section.open) expandedSections.add(id);
        else expandedSections.delete(id);
        writeSession(
          "wireBundler.expandedSections",
          JSON.stringify([...expandedSections]),
        );
      });
      return section;
    }

    function nestedSection(id, title, count, content, onHover) {
      const section = editorSection(id, title, count, content);
      section.className = "nested-details";
      if (onHover) hoverHighlight(section.children[0], onHover);
      return section;
    }

    function actionButton(label, title, handler, disabled = false, danger = false) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `icon-button${danger ? " danger" : ""}`;
      button.textContent = label;
      button.title = title;
      button.setAttribute("aria-label", title);
      button.disabled = disabled;
      button.addEventListener("click", handler);
      return button;
    }

    function optionsButton(title, handler, disabled = false) {
      const button = actionButton("Options", title, handler, disabled);
      button.className = "icon-button options-button";
      return button;
    }

    function hoverHighlight(node, onHover) {
      node.addEventListener("mouseenter", onHover);
      node.addEventListener("mouseleave", () => send("clear_highlight").catch(() => {}));
    }

    function memberRow(label, onReveal, actions = [], missing = false, clickToActivate = false) {
      const row = document.createElement("div");
      const reference = document.createElement("button");
      const actionContainer = document.createElement("div");
      row.className = `member-row${missing ? " missing" : ""}`;
      reference.type = "button";
      reference.className = "member-reference";
      reference.textContent = missing ? `${label} (geometry missing)` : label;
      reference.title = "Show linked sketch profile in Fusion";
      if (clickToActivate) reference.addEventListener("click", onReveal);
      else hoverHighlight(row, onReveal);
      actionContainer.className = "member-actions";
      actionContainer.append(...actions);
      row.append(reference, actionContainer);
      return row;

    function nameField(label, value, action, payload, placeholder = "Optional name") {
      const field = document.createElement("label");
      const input = document.createElement("input");
      field.textContent = label;
      input.type = "text";
      input.className = "filter";
      input.value = value || "";
      input.placeholder = placeholder;
      input.addEventListener("change", () => mutate(
        action, { ...payload, name: input.value }, "Saving name…",
      ));
      field.append(input);
      return field;
    }

    function wireLabel(wire) {
      return wire.displayName || `Wire #${wire.wireNumber}`;
    }

    function pathwayDirection(pathway) {
      const start = pathway?.startName || "A";
      const end = pathway?.endName || "B";
      return `${start} → ${end}`;
    }

    function pathwayRouteLabel(pathway) {
      if (!pathway) return "Missing pathway";
      const start = pathway.startName || "A";
      const end = pathway.endName || "B";
      return `${pathway.name} from ${start} to ${end}`;
    }

    function renderPathways(harness) {
      const container = document.createElement("div");
      const controls = new Map(
        harness.controls.map((control) => [control.controlId, control]),
      );
      const connections = new Map(
        harness.connections.map((connection) => [connection.connectionId, connection]),
      );
      const pathways = new Map(
        harness.pathways.map((pathway) => [pathway.pathwayId, pathway]),
      );
      container.className = "section-content";
      if (!harness.pathways.length) {
        container.append(emptyMessage("No pathways defined yet."));
        return container;
      }
      harness.pathways.forEach((pathway) => {
        const pathwayContent = document.createElement("div");
        const gateContent = document.createElement("div");
        const sequence = document.createElement("div");
        const occupancyContent = document.createElement("div");
        const occupancy = document.createElement("div");
        const addGates = document.createElement("button");
        const addWiresButton = document.createElement("button");
        const members = harness.wires.filter(
          (wire) => wire.orderedPathwayIds.includes(pathway.pathwayId),
        );
        pathwayContent.className = "section-content";
        gateContent.className = "section-content";
        sequence.className = "sequence";
        const gateRows = [];
        pathway.orderedControlIds.forEach((controlId, index) => {
          const control = controls.get(controlId);
          const openOptions = () => openInterpolationOptions(
            harness, "gate", controlId, control?.name || "Gate", control?.interpolation, null, control?.usesDefaults ?? true,
          );
          const movePayload = { harnessId: harness.harnessId, pathwayId: pathway.pathwayId, controlId };
          const row = memberRow(
            `${control?.name || "Missing gate"} #${controlId.slice(0, 8)}`,
            () => highlightMember(harness, "control", controlId),
            [
              optionsButton("Gate interpolation options", openOptions, !control),
              actionButton("×", "Remove gate", () => removeGate(
                harness, pathway, controlId, control?.name || "this gate",
              ), pathway.orderedControlIds.length === 1, true),
            ],
            !control || !control.hasLinkedGeometry,
          );
          row.children[0].title = "Click for gate options; drag to reorder";
          row.children[0].addEventListener("click", (event) => {
            if (event.detail === 0 && control) openOptions();
          });
          row.title = `Drag to reorder ${control?.name || "gate"} (${controlId})`;
          enableSequenceDrag(sequence, gateRows, row, index, (target) => mutate(
            "move_pathway_gate", { ...movePayload, offset: target - index }, "Reordering gate…",
          ), control ? openOptions : null);
          sequence.append(row);
        });
        occupancyContent.className = "section-content";
        occupancy.className = "occupancy";
        if (!members.length) {
          occupancy.append(emptyMessage("No wires occupy this pathway."));
        }
        members.forEach((wire) => {
          const pathwayIndex = wire.orderedPathwayIds.indexOf(pathway.pathwayId);
          const previousPathway = pathways.get(wire.orderedPathwayIds[pathwayIndex - 1]);
          const nextPathway = pathways.get(wire.orderedPathwayIds[pathwayIndex + 1]);
          const startConnection = connections.get(wire.startConnectionId);
          const endConnection = connections.get(wire.endConnectionId);
          const entry = pathwayIndex === 0
            ? `End A: ${wire.startEndName || startConnection?.name || "Missing connection"}`
            : `From ${previousPathway?.name || "missing pathway"}`;
          const exit = pathwayIndex === wire.orderedPathwayIds.length - 1
            ? `End B: ${wire.endEndName || endConnection?.name || "Missing connection"}`
            : `Continue to ${nextPathway?.name || "missing pathway"}`;
          const hasMissingGeometry = (pathwayIndex === 0 && !startConnection?.hasLinkedGeometry)
            || (pathwayIndex === wire.orderedPathwayIds.length - 1
              && !endConnection?.hasLinkedGeometry);
          occupancy.append(memberRow(
            `${wireLabel(wire)} · ${entry} → ${exit}`,
            () => highlightMember(harness, "preview_wire", wire.wireId),
            [],
            hasMissingGeometry,
          ));
        });
        addGates.type = "button";
        addGates.className = "button compact";
        addGates.textContent = "+ Add Gates";
        addGates.addEventListener("click", () => appendPathwayGates(harness, pathway));
        addWiresButton.type = "button";
        addWiresButton.className = "button compact";
        addWiresButton.textContent = "+ Add Wire Pairs";
        addWiresButton.addEventListener("click", () => addWires(pathway.pathwayId));
        const namePayload = { harnessId: harness.harnessId, pathwayId: pathway.pathwayId };
        gateContent.append(
          nameField("Start Name", pathway.startName, "rename_pathway", {
            ...namePayload, field: "start_name",
          }),
          sequence,
          nameField("End Name", pathway.endName, "rename_pathway", {
            ...namePayload, field: "end_name",
          }),
          addGates,
        );
        occupancyContent.append(occupancy, addWiresButton);
        pathwayContent.append(
          nameField("Pathway Name", pathway.name, "rename_pathway", {
            ...namePayload, field: "name",
          }),
          nestedSection(
            `pathway:${pathway.pathwayId}:gates`,
            "Gates · Traversal Order",
            `${pathway.orderedControlIds.length}`,
            gateContent,
            () => highlightMember(harness, "pathway_gates", pathway.pathwayId),
          ),
          nestedSection(
            `pathway:${pathway.pathwayId}:occupancy`,
            "Wire Occupancy",
            `${members.length}`,
            occupancyContent,
            () => highlightMember(harness, "pathway_wires", pathway.pathwayId),
          ),
        );
        container.append(nestedSection(
          `pathway:${pathway.pathwayId}`,
          pathway.name,
          `${pathwayDirection(pathway)} · ${members.length} wires`,
          pathwayContent,
          () => highlightMember(harness, "pathway", pathway.pathwayId),
        ));
      });
      return container;
    }

    function enableSequenceDrag(sequence, memberRows, row, memberIndex, onMove, onActivate = null) {
      const position = document.createElement("span");
      position.className = "sequence-position";
      position.textContent = `${memberIndex + 1}`;
      position.setAttribute("aria-label", `Position ${memberIndex + 1}`);
      row.insertBefore(position, row.children[0]);
      row.dataset.reorder = "true";
      let drag = null;
      const clearDrag = () => {
        drag = null;
        delete row.dataset.dragging;
        memberRows.forEach((item) => { delete item.dataset.drop; });
      };
      row.addEventListener("dragstart", (event) => event.preventDefault());
      row.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || event.target.closest(".icon-button")) return;
        drag = { x: event.clientX, y: event.clientY, active: false, target: memberIndex };
        row.setPointerCapture(event.pointerId);
      });
      row.addEventListener("pointermove", (event) => {
        if (!drag) return;
        if (!drag.active && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 5) return;
        event.preventDefault();
        drag.active = true;
        row.dataset.dragging = "true";
        memberRows.forEach((item) => { delete item.dataset.drop; });
        const bounds = sequence.getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX > bounds.right ||
            event.clientY < bounds.top - 12 || event.clientY > bounds.bottom + 12) {
          drag.target = null;
          return;
        }
        const others = memberRows.filter((item) => item !== row);
        const next = others.findIndex((item) => {
          const rect = item.getBoundingClientRect();
          return event.clientY < rect.top + rect.height / 2;
        });
        drag.target = next < 0 ? others.length : next;
        if (others.length) {
          const marker = next < 0 ? others[others.length - 1] : others[next];
          marker.dataset.drop = next < 0 ? "after" : "before";
        }
      });
      row.addEventListener("pointerup", (event) => {
        if (!drag) return;
        const target = drag.target;
        const clicked = !drag.active;
        const moved = drag.active && target !== null && target !== memberIndex;
        clearDrag();
        if (row.hasPointerCapture(event.pointerId)) row.releasePointerCapture(event.pointerId);
        if (moved) onMove(target);
        else if (clicked && onActivate) onActivate();
      });
      row.addEventListener("pointercancel", clearDrag);
      row.addEventListener("lostpointercapture", clearDrag);
      memberRows.push(row);
    }

    function renderEndpointSequence(harness, wires, connections, endpoint) {
      const sequence = document.createElement("div");
      sequence.className = "sequence";
      wires.forEach((wire) => {
        const connectionId = endpoint === "start" ? wire.startConnectionId : wire.endConnectionId;
        const connection = connections.get(connectionId);
        const members = connection?.members || (connection ? [{ index: 0, hasLinkedGeometry: connection.hasLinkedGeometry, usesDefaults: true }] : []);
        const payload = { harnessId: harness.harnessId, wireId: wire.wireId, endpoint, expectedMembers: members.length };
        const memberRows = [];
        members.forEach((member, memberIndex) => {
          const row = memberRow(
            member.memberId ? `#${member.memberId.slice(0, 8)}` : `${memberIndex + 1}`,
            () => highlightMember(harness, "connection", connectionId, { memberIndex }),
            [
              optionsButton("End member interpolation options", () => openInterpolationOptions(
                harness, "end", connectionId,
                `${endpoint === "start" ? "End A" : "End B"} · #${member.memberId?.slice(0, 8) || memberIndex + 1}`,
                member.interpolation || connection?.interpolation, member.memberId, member.usesDefaults ?? true,
              ), !member.memberId),
              actionButton("+", "Add member after this member", () => mutate(
                "edit_end_members", { ...payload, memberIndex, editAction: "add" }, "Select connection profiles…",
              )),
              actionButton("⇄", "Replace member", () => mutate(
                "edit_end_members", { ...payload, memberIndex, editAction: "replace" }, "Select replacement profile…",
              )),
              actionButton("×", "Remove member", () => {
                if (members.length === 1 && !window.confirm(
                  "Delete this end sequence? The wire will have a missing end.",
                )) return;
                mutate("remove_end_member", { ...payload, memberIndex }, "Removing end member…");
              }, false, true),
            ],
            !member.hasLinkedGeometry,
          );
          row.title = `Drag to reorder this end member${member.memberId ? ` (${member.memberId})` : ""}`;
          enableSequenceDrag(sequence, memberRows, row, memberIndex, (target) => mutate(
            "move_end_member", { ...payload, memberIndex, targetIndex: target }, "Reordering end member…",
          ));
          sequence.append(row);
        });
      });
      return sequence;
    }

    function routeNode(label, className = "") {
      const node = document.createElement("span");
      node.className = `route-node${className ? ` ${className}` : ""}`;
      node.textContent = label;
      node.title = label;
      return node;
    }

    function endRouteNode(label, connection, editor, otherEditor, name, onHover, onAdd) {
      const node = document.createElement("button");
      node.type = "button";
      node.className = `route-node${connection?.hasLinkedGeometry ? "" : " missing"}`;
      node.textContent = connection ? `${label}: ${name || connection.name}` : `+ Add ${label}`;
      node.title = `Open ${label} ordering`;
      node.setAttribute("aria-expanded", `${!editor.hidden}`);
      node.setAttribute("aria-controls", editor.id);
      node.addEventListener("click", () => {
        if (!connection) { onAdd(); return; }
        const willOpen = editor.hidden;
        editor.hidden = !willOpen;
        otherEditor.hidden = true;
        if (willOpen) expandedSections.add(editor.dataset.stateKey);
        else expandedSections.delete(editor.dataset.stateKey);
        expandedSections.delete(otherEditor.dataset.stateKey);
        writeSession("wireBundler.expandedSections", JSON.stringify([...expandedSections]));
        node.setAttribute("aria-expanded", `${willOpen}`);
        const otherNode = node.parentElement.querySelector(
          `.route-node[data-editor-id="${otherEditor.id}"]`,
        );
        if (otherNode) otherNode.setAttribute("aria-expanded", "false");
      });
      node.dataset.editorId = editor.id;
      if (connection) hoverHighlight(node, onHover);
      return node;
    }

    function renderEndEditor(harness, wires, connections, endpoint, id) {
      const editor = document.createElement("div");
      const heading = document.createElement("div");
      const label = document.createElement("strong");
      const metadata = document.createElement("span");
      const endLabel = endpoint === "start" ? "End A" : "End B";
      editor.id = id;
      editor.dataset.stateKey = `end:${harness.harnessId}:${wires[0].wireId}:${endpoint}`;
      editor.className = "end-editor";
      editor.hidden = !expandedSections.has(editor.dataset.stateKey);
      heading.className = "end-editor-heading";
      label.textContent = `${endLabel} Ordering`;
      metadata.className = "item-meta";
      metadata.textContent = wireLabel(wires[0]);
      heading.append(label, metadata);
      const nameLabel = document.createElement("label");
      const nameInput = document.createElement("input");
      nameLabel.textContent = `${endLabel} Name`;
      nameInput.type = "text";
      nameInput.className = "filter";
      nameInput.value = wires[0][endpoint === "start" ? "startEndName" : "endEndName"] || "";
      nameInput.placeholder = "Optional name";
      nameInput.addEventListener("change", () => mutate("rename_route_end", {
        harnessId: harness.harnessId,
        wireId: wires[0].wireId,
        endpoint,
        name: nameInput.value,
      }, "Saving end name…"));
      nameLabel.append(nameInput);
      editor.append(heading, nameLabel, renderEndpointSequence(harness, wires, connections, endpoint));
      return editor;
    }

    function wireHeader(harness, wire, details, missing) {
      const row = memberRow(wireLabel(wire), () => {
        details.hidden = !details.hidden;
        const stateKey = `wire:${harness.harnessId}:${wire.wireId}`;
        if (details.hidden) expandedSections.delete(stateKey);
        else expandedSections.add(stateKey);
        writeSession("wireBundler.expandedSections", JSON.stringify([...expandedSections]));
        label.setAttribute("aria-expanded", `${!details.hidden}`);
      }, [], missing, true);
      const label = row.children[0];
      const actions = row.children[1];
      label.title = "Expand or collapse wire";
      label.setAttribute("aria-expanded", `${!details.hidden}`);
      label.setAttribute("aria-controls", details.id);
      hoverHighlight(row, () => highlightMember(harness, "preview_wire", wire.wireId));
      const rename = actionButton("✎", "Rename wire", () => {
        if (row.querySelector("input")) return;
        const input = document.createElement("input");
        input.className = "filter";
        input.value = wire.displayName || "";
        input.placeholder = wireLabel(wire);
        input.setAttribute("aria-label", "Wire name");
        label.hidden = true;
        row.insertBefore(input, actions);
        let finished = false;
        const finish = (save) => {
          if (finished) return;
          finished = true;
          input.remove();
          label.hidden = false;
          if (save) mutate("rename_wire", {
            harnessId: harness.harnessId, wireId: wire.wireId, name: input.value,
          }, "Saving wire name…");
        };
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === "Escape") {
            event.preventDefault();
            finish(event.key === "Enter");
          }
        });
        input.addEventListener("blur", () => finish(true));
        input.focus();
        input.select();
      });
      actions.append(rename, actionButton(
        "×", `Remove ${wireLabel(wire)}`, () => removeWirePair(harness, wire), false, true,
      ));
      return row;
    }

    function openInterpolationOptions(harness, target, targetId = null, name = "", settings = {}, memberId = null, useDefaults = false) {
      const dialog = document.createElement("dialog");
      const form = document.createElement("form");
      const heading = document.createElement("h2");
      const note = document.createElement("p");
      const error = document.createElement("p");
      const actions = document.createElement("div");
      const cancel = document.createElement("button");
      const save = document.createElement("button");
      const isDefaults = target === "defaults";
      dialog.className = "wire-options";
      heading.textContent = isDefaults ? "Generation defaults" : `Interpolation · ${name}`;
      dialog.setAttribute("aria-label", heading.textContent);
      note.textContent = "Leave a distance blank for Auto. Auto expands toward the wire's safe bend minimum; crowded values are reduced to the feasible range, and crowded spans use a direct profile-to-profile curve when it preserves that radius. "
        + (isDefaults ? "Presets are used for new controls. Existing controls follow defaults unless individually customized."
          : target === "end" ? "These settings apply only to this member, in terminal → pathway order. The first member uses only its pathway-side distance."
            : "Approach and departure follow the gate traversal order. Changes affect all wires through this gate.");
      form.append(heading, note);
      const applyExisting = document.createElement("input");
      applyExisting.type = "checkbox";
      applyExisting.checked = true;
      if (isDefaults) {
        const applyLabel = document.createElement("label");
        applyLabel.className = "apply-existing";
        const applyText = document.createElement("span");
        applyText.textContent = "Update existing controls using defaults";
        applyExisting.setAttribute("aria-label", applyText.textContent);
        applyLabel.append(applyExisting, applyText);
        form.append(applyLabel);
      }
      const status = document.createElement("p");
      const updateStatus = () => { status.textContent = useDefaults ? "Using harness defaults" : "Custom settings"; };
      if (!isDefaults) { updateStatus(); form.append(status); }
      const fields = [];
      const addFields = (prefix, initial, endSection) => {
        const inputs = {};
        for (const [key, text] of [["approach_mm", endSection ? "Terminal-side transition" : "Approach transition"],
          ["departure_mm", endSection ? "Pathway-side transition" : "Departure transition"]]) {
          const label = document.createElement("label");
          const input = document.createElement("input");
          label.textContent = `${prefix}${text} (mm)`;
          input.type = "number";
          input.className = "filter";
          input.step = "any";
          input.min = "0";
          input.placeholder = "Auto";
          input.value = initial?.[key] == null ? "" : `${initial[key]}`;
          input.addEventListener("input", () => { useDefaults = false; updateStatus(); });
          input.setAttribute("aria-label", label.textContent);
          label.append(input);
          form.append(label);
          fields.push(input);
          inputs[key] = input;
        }
        return inputs;
      };
      const primary = addFields(isDefaults ? "Gates · " : "", isDefaults ? harness.gateDefaults : settings, target === "end");
      const ends = isDefaults ? addFields("Ends · ", harness.endDefaults, true) : null;
      if (!isDefaults) {
        const reset = document.createElement("button");
        reset.type = "button";
        reset.className = "button";
        reset.textContent = "Use harness defaults";
        reset.addEventListener("click", () => {
          useDefaults = true;
          updateStatus();
          const defaults = target === "gate" ? harness.gateDefaults : harness.endDefaults;
          for (const [key, input] of Object.entries(primary)) {
            input.value = defaults?.[key] == null ? "" : `${defaults[key]}`;
          }
        });
        form.append(reset);
      }
      error.setAttribute("role", "alert");
      error.style.color = "var(--danger)";
      actions.className = "actions";
      cancel.type = "button";
      cancel.className = "button";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => dialog.close());
      save.type = "submit";
      save.className = "button primary";
      save.textContent = "Save";
      const values = (inputs) => Object.fromEntries(Object.entries(inputs).map(([key, input]) =>
        [key, input.value.trim() === "" ? null : Number(input.value)]));
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (fields.some((input) => input.validity?.badInput || (input.value.trim() !== ""
          && (!Number.isFinite(Number(input.value)) || Number(input.value) < 0)))) {
          error.textContent = "Enter nonnegative distances in millimeters, or leave blank for Auto.";
          return;
        }
        save.disabled = true;
        try {
          const response = await send("set_interpolation", {
            harnessId: harness.harnessId, target, targetId, memberId, useDefaults, settings: values(primary),
            ...(ends ? { endDefaults: values(ends), applyExisting: applyExisting.checked } : {}),
          });
          if (response.ok) dialog.close();
          else error.textContent = response.error || "Could not save interpolation options.";
        } catch (failure) {
          error.textContent = failure.message;
        } finally {
          save.disabled = false;
        }
      });
      dialog.addEventListener("close", () => dialog.remove());
      actions.append(cancel, save);
      form.append(error, actions);
      dialog.append(form);
      document.body.append(dialog);
      dialog.showModal();
    }

    function colorFromHex(name, hex) {
      const normalized = /^#[0-9a-f]{6}$/i.test(hex) ? hex.slice(1) : "202020";
      return {
        name: name.trim() || "Custom",
        red: Number.parseInt(normalized.slice(0, 2), 16),
        green: Number.parseInt(normalized.slice(2, 4), 16),
        blue: Number.parseInt(normalized.slice(4, 6), 16),
      };
    }

    function openMaterialOptions(harness, wire = null) {
      const isWire = wire !== null;
      const settings = isWire ? wire.materials : harness.materialDefaults;
      const overrides = isWire ? wire.materialOverrides : null;
      const catalog = currentState.catalog || {
        insulationMaterials: [], conductorMaterials: [], colors: [], stripePatterns: [],
      };
      const dialog = document.createElement("dialog");
      const form = document.createElement("form");
      const heading = document.createElement("h2");
      const note = document.createElement("p");
      const error = document.createElement("p");
      const actions = document.createElement("div");
      const cancel = document.createElement("button");
      const apply = document.createElement("button");
      const save = document.createElement("button");
      const controls = {};
      dialog.className = "wire-options material-options";
      heading.textContent = isWire
        ? `Wire materials · ${wireLabel(wire)}` : "Harness wire-material defaults";
      note.textContent = isWire
        ? "Checked fields override this harness. Unchecked fields follow the harness defaults."
        : "These values are inherited by every wire unless that wire overrides a field.";
      form.append(heading, note);

      const addAutocomplete = (wrapper, input, values, onChoose = () => {}) => {
        const menu = document.createElement("div");
        const available = values.map((value) => typeof value === "string" ? value : value.name);
        wrapper.classList.add("autocomplete");
        menu.className = "autocomplete-suggestions";
        menu.hidden = true;
        const renderSuggestions = () => {
          const query = input.value.trim().toLocaleLowerCase();
          const matches = available.filter(
            (value) => !query || value.toLocaleLowerCase().includes(query),
          ).slice(0, 16);
          menu.replaceChildren();
          matches.forEach((value) => {
            const choice = document.createElement("button");
            choice.type = "button";
            choice.textContent = value;
            choice.addEventListener("mousedown", (event) => event.preventDefault());
            choice.addEventListener("click", () => {
              input.value = value;
              menu.hidden = true;
              onChoose(value);
            });
            menu.append(choice);
          });
          menu.hidden = matches.length === 0;
        };
        input.addEventListener("click", renderSuggestions);
        input.addEventListener("input", renderSuggestions);
        input.addEventListener("blur", () => { menu.hidden = true; });
        wrapper.append(menu);
      };

      const addOverrideToggle = (header, key, update) => {
        if (!isWire) return null;
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        const text = document.createElement("span");
        checkbox.type = "checkbox";
        checkbox.checked = overrides[key] !== null;
        text.textContent = "Override";
        checkbox.addEventListener("change", update);
        label.append(checkbox, text);
        header.append(label);
        return checkbox;
      };

      const addTextField = (key, labelText, suggestions = [], multiline = false) => {
        const wrapper = document.createElement("div");
        const header = document.createElement("div");
        const label = document.createElement("strong");
        const input = document.createElement(multiline ? "textarea" : "input");
        wrapper.className = "material-field";
        header.className = "material-field-heading";
        label.textContent = labelText;
        if (!multiline) input.type = "text";
        input.className = "filter";
        input.value = settings[key] || "";
        const update = () => { input.disabled = Boolean(toggle && !toggle.checked); };
        const toggle = addOverrideToggle(header, key, update);
        header.prepend(label);
        update();
        wrapper.append(header, input);
        if (!multiline && suggestions.length) addAutocomplete(wrapper, input, suggestions);
        form.append(wrapper);
        controls[key] = { input, toggle };
      };

      addTextField("insulationMaterial", "Insulation material", catalog.insulationMaterials);
      addTextField("conductorMaterial", "Conductor material", catalog.conductorMaterials);

      const colorWrapper = document.createElement("div");
      const colorHeader = document.createElement("div");
      const colorLabel = document.createElement("strong");
      const colorRow = document.createElement("div");
      const colorPicker = document.createElement("input");
      const colorNameWrapper = document.createElement("div");
      const colorName = document.createElement("input");
      const appearanceSource = document.createElement("select");
      const libraryControls = document.createElement("div");
      const libraryLabel = document.createElement("label");
      const librarySelect = document.createElement("select");
      const appearanceLabel = document.createElement("label");
      const appearanceSelect = document.createElement("select");
      colorWrapper.className = "material-field";
      colorHeader.className = "material-field-heading";
      colorLabel.textContent = "Main insulation appearance";
      colorRow.className = "material-color-row";
      appearanceSource.className = "appearance-source";
      libraryControls.className = "appearance-library-controls";
      colorPicker.type = "color";
      colorPicker.value = settings.mainColor.hex;
      colorName.type = "text";
      colorName.className = "filter";
      colorName.value = settings.mainColor.name;
      [
        ["color", "Catalog or custom color"],
        ["library", "Fusion library appearance"],
      ].forEach(([value, label]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        appearanceSource.append(option);
      });
      appearanceSource.value = settings.appearance ? "library" : "color";
      librarySelect.title = "Fusion appearance library";
      appearanceSelect.title = "Fusion appearance";
      let loadedLibraries = [];
      let loadedAppearances = [];
      const setOptions = (select, values, selectedId, placeholder) => {
        select.replaceChildren();
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = placeholder;
        select.append(empty);
        values.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.name;
          option.selected = item.id === selectedId;
          select.append(option);
        });
        select.value = values.some((item) => item.id === selectedId) ? selectedId : "";
      };
      const loadAppearances = async (libraryId, selectedId = "") => {
        setOptions(appearanceSelect, [], "", "Loading appearances…");
        appearanceSelect.disabled = true;
        const response = await send("get_library_appearances", { libraryId });
        if (!response.ok) throw new Error(response.error || "Could not read Fusion appearances.");
        loadedAppearances = response.appearances;
        setOptions(appearanceSelect, loadedAppearances, selectedId, "Select appearance");
        updateColor();
      };
      const loadAppearanceLibraries = async () => {
        try {
          const response = await send("get_appearance_libraries");
          if (!response.ok) {
            error.textContent = response.error || "Could not read appearance libraries.";
            setOptions(librarySelect, [], "", "Libraries unavailable");
            setOptions(appearanceSelect, [], "", "Appearances unavailable");
            return;
          }
          loadedLibraries = response.libraries;
          const selectedLibrary = settings.appearance?.libraryId || loadedLibraries[0]?.id || "";
          setOptions(librarySelect, loadedLibraries, selectedLibrary, "Select library");
          if (selectedLibrary && appearanceSource.value === "library") {
            await loadAppearances(selectedLibrary, settings.appearance?.appearanceId || "");
          }
          updateColor();
        } catch (failure) {
          error.textContent = failure.message;
          setOptions(librarySelect, [], "", "Libraries unavailable");
          setOptions(appearanceSelect, [], "", "Appearances unavailable");
        }
      };
      const updateColor = () => {
        const disabled = Boolean(colorToggle && !colorToggle.checked);
        const usesLibrary = appearanceSource.value === "library";
        appearanceSource.disabled = disabled;
        colorPicker.disabled = disabled || usesLibrary;
        colorName.disabled = disabled || usesLibrary;
        libraryControls.hidden = !usesLibrary;
        librarySelect.disabled = disabled || !usesLibrary || loadedLibraries.length === 0;
        appearanceSelect.disabled = disabled || !usesLibrary || loadedAppearances.length === 0;
      };
      const colorToggle = addOverrideToggle(colorHeader, "mainColor", updateColor);
      colorName.addEventListener("change", () => {
        const match = catalog.colors.find(
          (item) => item.name.toLocaleLowerCase() === colorName.value.trim().toLocaleLowerCase(),
        );
        if (match) colorPicker.value = match.hex;
      });
      colorPicker.addEventListener("input", () => {
        const match = catalog.colors.find(
          (item) => item.hex.toLocaleLowerCase() === colorPicker.value.toLocaleLowerCase(),
        );
        colorName.value = match?.name || "Custom";
      });
      appearanceSource.addEventListener("change", async () => {
        updateColor();
        if (appearanceSource.value === "library" && librarySelect.value
            && loadedAppearances.length === 0) {
          try {
            await loadAppearances(librarySelect.value, settings.appearance?.appearanceId || "");
          } catch (failure) {
            error.textContent = failure.message;
          }
        }
      });
      librarySelect.addEventListener("change", async () => {
        try {
          if (!librarySelect.value) {
            loadedAppearances = [];
            setOptions(appearanceSelect, [], "", "Select appearance");
            updateColor();
            return;
          }
          await loadAppearances(librarySelect.value);
        } catch (failure) {
          error.textContent = failure.message;
        }
      });
      colorHeader.prepend(colorLabel);
      updateColor();
      colorNameWrapper.append(colorName);
      colorRow.append(colorPicker, colorNameWrapper);
      libraryLabel.textContent = "Library";
      libraryLabel.append(librarySelect);
      appearanceLabel.textContent = "Appearance";
      appearanceLabel.append(appearanceSelect);
      libraryControls.append(libraryLabel, appearanceLabel);
      colorWrapper.append(colorHeader, appearanceSource, colorRow, libraryControls);
      addAutocomplete(colorNameWrapper, colorName, catalog.colors, (name) => {
        const match = catalog.colors.find((item) => item.name === name);
        if (match) colorPicker.value = match.hex;
      });
      form.append(colorWrapper);
      controls.mainColor = { colorPicker, colorName, toggle: colorToggle };

      const stripeWrapper = document.createElement("div");
      const stripeHeader = document.createElement("div");
      const stripeLabel = document.createElement("strong");
      const stripeList = document.createElement("div");
      const addStripe = document.createElement("button");
      stripeWrapper.className = "material-field";
      stripeHeader.className = "material-field-heading";
      stripeLabel.textContent = "Procedural stripes";
      stripeList.className = "stripe-list";
      addStripe.type = "button";
      addStripe.className = "button compact";
      addStripe.textContent = "+ Add stripe";

      const appendStripe = (stripe = null) => {
        const value = stripe || {
          color: catalog.colors.find((item) => item.name === "White")
            || { name: "White", hex: "#F5F5F5" },
          widthMm: 0.4, pattern: "longitudinal", angleDeg: 0, repeatMm: null,
        };
        const row = document.createElement("div");
        const picker = document.createElement("input");
        const values = document.createElement("div");
        const pattern = document.createElement("select");
        const width = document.createElement("input");
        const angle = document.createElement("input");
        const repeat = document.createElement("input");
        const remove = document.createElement("button");
        row.className = "stripe-row";
        picker.type = "color";
        picker.value = value.color.hex;
        values.className = "stripe-values";
        (catalog.stripePatterns.length
          ? catalog.stripePatterns : ["longitudinal", "dashed", "helical"]
        ).forEach((item) => {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          option.selected = item === value.pattern;
          pattern.append(option);
        });
        const numericField = (labelText, input, initial) => {
          const label = document.createElement("label");
          label.textContent = labelText;
          input.type = "number";
          input.step = "any";
          input.value = initial == null ? "" : `${initial}`;
          label.append(input);
          return label;
        };
        const updateRepeat = () => {
          repeat.disabled = pattern.disabled || pattern.value === "longitudinal";
          if (pattern.value === "longitudinal") repeat.value = "";
        };
        pattern.addEventListener("change", updateRepeat);
        remove.type = "button";
        remove.className = "icon-button danger";
        remove.textContent = "×";
        remove.title = "Remove stripe";
        remove.addEventListener("click", () => row.remove());
        values.append(
          numericField("Width (mm)", width, value.widthMm),
          numericField("Angle (deg)", angle, value.angleDeg),
          (() => {
            const label = document.createElement("label");
            label.textContent = "Pattern";
            label.append(pattern);
            return label;
          })(),
          numericField("Repeat (mm)", repeat, value.repeatMm),
        );
        row.append(picker, values, remove);
        stripeList.append(row);
        updateRepeat();
        updateStripes();
      };
      const updateStripes = () => {
        const disabled = Boolean(stripeToggle && !stripeToggle.checked);
        addStripe.disabled = disabled;
        stripeList.querySelectorAll("input, select, button").forEach((input) => {
          input.disabled = disabled;
        });
        if (!disabled) {
          stripeList.querySelectorAll("select").forEach((pattern) => {
            const repeat = pattern.closest(".stripe-values").querySelector("label:last-child input");
            repeat.disabled = pattern.value === "longitudinal";
          });
        }
      };
      const stripeToggle = addOverrideToggle(stripeHeader, "stripes", updateStripes);
      stripeHeader.prepend(stripeLabel);
      (settings.stripes || []).forEach(appendStripe);
      addStripe.addEventListener("click", () => appendStripe());
      updateStripes();
      stripeWrapper.append(stripeHeader, stripeList, addStripe);
      form.append(stripeWrapper);

      addTextField("manufacturer", "Manufacturer");
      addTextField("partNumber", "Part number");
      addTextField("notes", "Notes", [], true);

      const readStripes = () => [...stripeList.children].map((row, index) => {
        const inputs = row.querySelectorAll("input");
        const pattern = row.querySelector("select").value;
        const width = Number(inputs[1].value);
        const angle = Number(inputs[2].value);
        const repeat = inputs[3].value.trim() === "" ? null : Number(inputs[3].value);
        if (!Number.isFinite(width) || width <= 0 || !Number.isFinite(angle)
            || (pattern !== "longitudinal" && (!Number.isFinite(repeat) || repeat <= 0))) {
          throw new Error(`Stripe ${index + 1} needs a positive width, finite angle, and pattern repeat.`);
        }
        const catalogColor = catalog.colors.find(
          (item) => item.hex.toLocaleLowerCase() === inputs[0].value.toLocaleLowerCase(),
        );
        return {
          color: colorFromHex(catalogColor?.name || "Custom", inputs[0].value),
          widthMm: width, pattern, angleDeg: angle, repeatMm: repeat,
        };
      });

      error.setAttribute("role", "alert");
      error.style.color = "var(--danger)";
      actions.className = "actions";
      cancel.type = "button";
      cancel.className = "button";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => dialog.close());
      apply.type = "button";
      apply.className = "button";
      apply.textContent = "Apply";
      save.type = "submit";
      save.className = "button primary";
      save.textContent = "Save";
      const applyMaterials = async (closeAfter) => {
        try {
          const fieldValue = (key) => {
            const control = controls[key];
            return isWire && !control.toggle.checked ? null : control.input.value;
          };
          let appearance = null;
          if ((!isWire || colorToggle.checked) && appearanceSource.value === "library") {
            const library = loadedLibraries.find((item) => item.id === librarySelect.value);
            const selected = loadedAppearances.find(
              (item) => item.id === appearanceSelect.value,
            );
            if (!library || !selected) {
              error.textContent = "Select a Fusion appearance library and appearance.";
              return;
            }
            appearance = {
              libraryId: library.id,
              libraryName: library.name,
              appearanceId: selected.id,
              appearanceName: selected.name,
            };
          }
          const materials = {
            insulationMaterial: fieldValue("insulationMaterial"),
            conductorMaterial: fieldValue("conductorMaterial"),
            mainColor: isWire && !colorToggle.checked ? null
              : colorFromHex(colorName.value, colorPicker.value),
            appearance: isWire && !colorToggle.checked ? null : appearance,
            stripes: isWire && !stripeToggle.checked ? null : readStripes(),
            manufacturer: fieldValue("manufacturer"),
            partNumber: fieldValue("partNumber"),
            notes: fieldValue("notes"),
          };
          if ((!isWire || materials.insulationMaterial !== null)
              && !materials.insulationMaterial.trim()) {
            error.textContent = "Insulation material must not be empty.";
            return;
          }
          if ((!isWire || materials.conductorMaterial !== null)
              && !materials.conductorMaterial.trim()) {
            error.textContent = "Conductor material must not be empty.";
            return;
          }
          apply.disabled = true;
          save.disabled = true;
          const response = await send(
            isWire ? "set_wire_material_overrides" : "set_harness_material_defaults",
            isWire
              ? { harnessId: harness.harnessId, wireId: wire.wireId, overrides: materials }
              : { harnessId: harness.harnessId, materials },
          );
          if (response.ok) {
            error.textContent = closeAfter ? "" : "Applied.";
            if (closeAfter) dialog.close();
          }
          else error.textContent = response.error || "Could not save wire materials.";
        } catch (failure) {
          error.textContent = failure.message;
        } finally {
          apply.disabled = false;
          save.disabled = false;
        }
      };
      apply.addEventListener("click", () => applyMaterials(false));
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        applyMaterials(true);
      });
      dialog.addEventListener("close", () => dialog.remove());
      actions.append(cancel, apply, save);
      form.append(error, actions);
      dialog.append(form);
      document.body.append(dialog);
      dialog.showModal();
      loadAppearanceLibraries();
    }

    function openWireOptions(harness, wire, profile) {
      const dialog = document.createElement("dialog");
      const form = document.createElement("form");
      const heading = document.createElement("h2");
      const label = document.createElement("label");
      const diameter = document.createElement("input");
      const error = document.createElement("p");
      const actions = document.createElement("div");
      const cancel = document.createElement("button");
      const save = document.createElement("button");
      dialog.className = "wire-options";
      dialog.setAttribute("aria-label", `Wire options: ${wireLabel(wire)}`);
      heading.textContent = `Wire options · ${wireLabel(wire)}`;
      label.textContent = "Wire diameter (mm)";
      diameter.type = "number";
      diameter.className = "filter";
      diameter.step = "any";
      diameter.required = true;
      diameter.value = `${profile.diameterMm}`;
      label.append(diameter);
      error.setAttribute("role", "alert");
      error.style.color = "var(--danger)";
      actions.className = "actions";
      cancel.type = "button";
      cancel.className = "button";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => dialog.close());
      save.type = "submit";
      save.className = "button primary";
      save.textContent = "Save";
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const value = Number(diameter.value);
        if (!Number.isFinite(value) || value <= 0) {
          error.textContent = "Enter a positive diameter in millimeters.";
          return;
        }
        save.disabled = true;
        try {
          const response = await send("set_wire_diameter", {
            harnessId: harness.harnessId, wireId: wire.wireId, diameterMm: value,
          });
          if (response.ok) dialog.close();
          else error.textContent = response.error || "Could not save wire diameter.";
        } catch (failure) {
          error.textContent = failure.message;
        } finally {
          save.disabled = false;
        }
      });
      dialog.addEventListener("close", () => dialog.remove());
      actions.append(cancel, save);
      form.append(heading, label, error, actions);
      dialog.append(form);
      document.body.append(dialog);
      dialog.showModal();
    }

    function renderWireRoutes(harness) {
      const key = harnessKey(harness);
      const connections = new Map(
        harness.connections.map((connection) => [connection.connectionId, connection]),
      );
      const profiles = new Map(
        harness.profiles.map((profile) => [profile.profileId, profile]),
      );
      const pathways = new Map(
        harness.pathways.map((pathway) => [pathway.pathwayId, pathway]),
      );
      const container = document.createElement("div");
      const filter = document.createElement("input");
      const routes = document.createElement("div");
      container.className = "section-content";
      filter.className = "filter wire-filter";
      filter.type = "search";
      filter.placeholder = "Filter wire routes…";
      filter.setAttribute("aria-label", "Filter wire routes");
      filter.value = routeFilters.get(key) || "";
      filter.autocomplete = "off";
      const renderRoutes = () => {
        const query = filter.value.trim().toLocaleLowerCase();
        routeFilters.set(key, query);
        routes.replaceChildren();
        const visibleWires = harness.wires.filter((wire) => {
          const start = wire.startEndName || connections.get(wire.startConnectionId)?.name || "Missing End A";
          const end = wire.endEndName || connections.get(wire.endConnectionId)?.name || "Missing End B";
          const path = wire.orderedPathwayIds
            .map((id) => `${pathways.get(id)?.name || "Missing pathway"} ${pathwayDirection(pathways.get(id))}`)
            .join(" ");
          return `${wire.wireNumber} ${wireLabel(wire)} ${start} ${end} ${path}`
            .toLocaleLowerCase()
            .includes(query);
        });
        if (!visibleWires.length) {
          routes.append(emptyMessage(
            harness.wires.length ? "No wire routes match this filter." : "No wires defined yet.",
          ));
          return;
        }
        visibleWires.forEach((wire) => {
          const card = document.createElement("div");
          const flow = document.createElement("div");
          const profile = profiles.get(wire.profileId);
          const start = connections.get(wire.startConnectionId);
          const end = connections.get(wire.endConnectionId);
          const endAEditor = renderEndEditor(
            harness, [wire], connections, "start", `end-a-${wire.wireId}`,
          );
          const endBEditor = renderEndEditor(
            harness, [wire], connections, "end", `end-b-${wire.wireId}`,
          );
          card.className = "wire-route";
          card.dataset.wireId = wire.wireId;
          flow.className = "route-flow";
          flow.append(endRouteNode(
            "End A", start, endAEditor, endBEditor, wire.startEndName,
            () => highlightMember(harness, "connection", wire.startConnectionId),
            () => mutate("edit_end_members", {
              harnessId: harness.harnessId, wireId: wire.wireId, endpoint: "start",
              editAction: "add", expectedMembers: 0,
            }, "Select End A profiles…"),
          ));
          wire.orderedPathwayIds.forEach((pathwayId) => {
            const arrow = document.createElement("span");
            const pathway = pathways.get(pathwayId);
            arrow.className = "route-arrow";
            arrow.textContent = "→";
            const pathwayNode = routeNode(
                pathwayRouteLabel(pathway),
                pathway ? "pathway" : "missing",
            );
            hoverHighlight(pathwayNode, () => highlightMember(harness, "pathway_gates", pathwayId));
            flow.append(arrow, pathwayNode);
          });
          const finalArrow = document.createElement("span");
          finalArrow.className = "route-arrow";
          finalArrow.textContent = "→";
          flow.append(finalArrow, endRouteNode(
            "End B", end, endBEditor, endAEditor, wire.endEndName,
            () => highlightMember(harness, "connection", wire.endConnectionId),
            () => mutate("edit_end_members", {
              harnessId: harness.harnessId, wireId: wire.wireId, endpoint: "end",
              editAction: "add", expectedMembers: 0,
            }, "Select End B profiles…"),
          ));
          const details = document.createElement("div");
          details.className = "wire-details";
          details.id = `wire-details-${wire.wireId}`;
          details.hidden = !expandedSections.has(`wire:${harness.harnessId}:${wire.wireId}`);
          const profileNode = document.createElement("button");
          const materialNode = document.createElement("button");
          profileNode.type = "button";
          profileNode.className = `route-node${profile ? "" : " missing"}`;
          profileNode.textContent = profile
            ? `${profile.name} · ${profile.diameterMm} mm` : "Missing wire specification";
          profileNode.title = "Edit wire-wide options";
          profileNode.disabled = !profile;
