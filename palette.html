<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness Builder</title>
  <!-- Dynamic elements use these classes at runtime. -->
  <!--suppress CssUnusedSymbol -->
  <style>
    :root {
      color-scheme: light;
      font: 13px system-ui, sans-serif;
      --accent: #1777c8;
      --border: #c8cdd2;
      --muted: #68717a;
      --surface: #fff;
      --surface-subtle: #f4f5f6;
      --text: #202428;
      --danger: #b44242;
      --success: #287d28;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface-subtle); color: var(--text); }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .app-header {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    h1 { margin: 0; font-size: 17px; }
    h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
    h3 { margin: 0; font-size: 13px; }
    .button {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 10px;
      background: var(--surface);
    }
    .button:hover { border-color: #9199a1; background: #f8f9fa; }
    .button:disabled { cursor: default; opacity: .5; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .button.compact { padding: 5px 8px; }
    main { padding: 14px; }
    #notice { min-height: 18px; margin: 0 0 10px; color: var(--success); }
    .library-actions { display: grid; gap: 10px; }
    #create { width: 100%; }
    .filter {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--text);
    }
    .section-label {
      margin: 20px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    #harnesses { display: grid; gap: 8px; }
    .harness-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 10px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 11px;
      background: var(--surface);
      text-align: left;
    }
    .harness-card:hover { border-color: var(--accent); }
    .harness-card[data-status="damaged"] { border-color: var(--danger); }
    .harness-card strong { overflow-wrap: anywhere; }
    .harness-card .summary { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
    .status {
      align-self: start;
      border-radius: 999px;
      padding: 2px 7px;
      background: #e8edf1;
      color: #48525b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .status[data-status="valid"] { background: #dff1df; color: #226b22; }
    .status[data-status="damaged"] { background: #f5dfdf; color: #8e3030; }
    .editor-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .editor-heading { display: grid; gap: 5px; margin-bottom: 14px; }
    .editor-heading .meta { color: var(--muted); }
    .overview {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 5px 12px;
      margin: 0 0 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    .overview dt { color: var(--muted); }
    .overview dd { margin: 0; overflow-wrap: anywhere; }
    details {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 11px;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▸"; color: var(--muted); }
    details[open] summary::after { content: "▾"; }
    .count { color: var(--muted); font-size: 11px; font-weight: 500; }
    .section-content { display: grid; gap: 8px; padding: 0 11px 11px; }
    .item {
      display: grid;
      gap: 3px;
      padding-top: 8px;
      border-top: 1px solid #e5e8eb;
    }
    .item:first-child { padding-top: 0; border-top: 0; }
    .item-main { display: flex; justify-content: space-between; gap: 10px; }
    .item-main strong { overflow-wrap: anywhere; }
    .item-meta, .route { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .route { line-height: 1.5; }
    .wire-filter { margin-bottom: 2px; }
    .wire-rows { display: grid; gap: 8px; }
    .validation-list { margin: 0; padding-left: 20px; }
    .validation-list li + li { margin-top: 6px; }
    .validation-list.errors { color: var(--danger); }
    .empty { margin: 0; color: var(--muted); }
    .error-panel {
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: 11px;
      background: #fff8f8;
      color: #7e2929;
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Harness Builder</h1>
    <button id="refresh" class="button compact" type="button">Refresh</button>
  </header>
  <main>
    <p id="notice" role="status"></p>
    <section id="library-view" aria-label="Harness library">
      <div class="library-actions">
        <button id="create" class="button primary" type="button">Create New Harness</button>
        <input id="harness-filter" class="filter" type="search"
               aria-label="Filter harnesses" placeholder="Filter harnesses…"
               autocomplete="off" spellcheck="false">
      </div>
      <p class="section-label">Existing Harnesses</p>
      <div id="harnesses"><p class="empty">Loading…</p></div>
    </section>
    <section id="editor-view" aria-label="Harness editor" hidden>
      <div class="editor-nav">
        <button id="back" class="button compact" type="button">← All Harnesses</button>
        <button id="add-pathway" class="button compact primary" type="button">Add Pathway</button>
        <button id="add-wires" class="button compact primary" type="button">Add Wires</button>
        <button id="preview-routes" class="button compact primary" type="button">Preview Routes</button>
        <button id="clear-preview" class="button compact" type="button">Clear Preview</button>
        <button id="create-from-editor" class="button compact" type="button">New Harness</button>
      </div>
      <div id="editor"></div>
    </section>
  </main>
  <script>
    const ui = {
      back: document.getElementById("back"),
      addPathway: document.getElementById("add-pathway"),
      addWires: document.getElementById("add-wires"),
      previewRoutes: document.getElementById("preview-routes"),
      clearPreview: document.getElementById("clear-preview"),
      create: document.getElementById("create"),
      createFromEditor: document.getElementById("create-from-editor"),
      editor: document.getElementById("editor"),
      editorView: document.getElementById("editor-view"),
      harnessFilter: document.getElementById("harness-filter"),
      libraryView: document.getElementById("library-view"),
      list: document.getElementById("harnesses"),
      notice: document.getElementById("notice"),
      refresh: document.getElementById("refresh"),
    };

    function readSession(key) {
      try { return window.sessionStorage.getItem(key); }
      catch (_error) { return null; }
    }

    function writeSession(key, value) {
      try { window.sessionStorage.setItem(key, value); }
      catch (_error) { /* Palette storage is an optional convenience. */ }
    }

    function removeSession(key) {
      try { window.sessionStorage.removeItem(key); }
      catch (_error) { /* Palette storage is an optional convenience. */ }
    }

    let currentState = { harnesses: [], notice: "" };
    let selectedHarnessKey = readSession("wireBundler.selectedHarness") || "";
    const wireFilters = new Map();
    const storedExpandedSections = readSession("wireBundler.expandedSections");
    let hasStoredExpansionState = storedExpandedSections !== null;
    let expandedSectionIds = [];
    try {
      expandedSectionIds = JSON.parse(storedExpandedSections || "[]");
      if (!Array.isArray(expandedSectionIds)) expandedSectionIds = [];
    } catch (_error) {
      expandedSectionIds = [];
    }
    const expandedSections = new Set(expandedSectionIds);

    function harnessKey(harness) {
      return harness.harnessId || `component:${harness.componentName}`;
    }

    function emptyMessage(text) {
      const paragraph = document.createElement("p");
      paragraph.className = "empty";
      paragraph.textContent = text;
      return paragraph;
    }

    function statusBadge(harness) {
      const badge = document.createElement("span");
      badge.className = "status";
      badge.dataset.status = harness.status;
      badge.textContent = harness.status;
      return badge;
    }

    function renderLibrary() {
      const query = ui.harnessFilter.value.trim().toLocaleLowerCase();
      const harnesses = currentState.harnesses.filter((harness) => {
        const searchable = `${harness.componentName} ${harness.routingMode || ""} ${harness.status}`;
        return searchable.toLocaleLowerCase().includes(query);
      });
      ui.list.replaceChildren();
      if (!harnesses.length) {
        const message = currentState.harnesses.length
          ? "No harnesses match this filter."
          : "No procedural harnesses in this design.";
        ui.list.append(emptyMessage(message));
        return;
      }
      harnesses.forEach((harness) => {
        const button = document.createElement("button");
        const name = document.createElement("strong");
        const summary = document.createElement("span");
        button.type = "button";
        button.className = "harness-card";
        button.dataset.status = harness.status;
        name.textContent = harness.componentName;
        summary.className = "summary";
        summary.textContent = harness.status === "damaged"
          ? "Metadata could not be loaded"
          : `${harness.routingMode} · ${harness.wires.length} wires`;
        button.append(name, statusBadge(harness), summary);
        button.addEventListener("click", () => openHarness(harnessKey(harness)));
        ui.list.append(button);
      });
    }

    function definitionList(items, renderItem, emptyText) {
      const container = document.createElement("div");
      container.className = "section-content";
      if (!items.length) {
        container.append(emptyMessage(emptyText));
        return container;
      }
      items.forEach((item) => container.append(renderItem(item)));
      return container;
    }

    function itemRow(title, meta, route = "") {
      const row = document.createElement("div");
      const main = document.createElement("div");
      const heading = document.createElement("strong");
      const metadata = document.createElement("span");
      row.className = "item";
      main.className = "item-main";
      heading.textContent = title;
      metadata.className = "item-meta";
      metadata.textContent = meta;
      main.append(heading, metadata);
      row.append(main);
      if (route) {
        const routeText = document.createElement("div");
        routeText.className = "route";
        routeText.textContent = route;
        row.append(routeText);
      }
      return row;
    }

    function editorSection(id, title, count, content, openByDefault = false) {
      const section = document.createElement("details");
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      const counter = document.createElement("span");
      section.dataset.section = id;
      section.open = expandedSections.has(id) || (openByDefault && !hasStoredExpansionState);
      label.textContent = title;
      counter.className = "count";
      counter.textContent = count;
      summary.append(label, counter);
      section.append(summary, content);
      section.addEventListener("toggle", () => {
        hasStoredExpansionState = true;
        if (section.open) expandedSections.add(id);
        else expandedSections.delete(id);
        writeSession(
          "wireBundler.expandedSections",
          JSON.stringify([...expandedSections]),
        );
      });
      return section;
    }

    function renderWires(harness) {
      const key = harnessKey(harness);
      const connections = new Map(
        harness.connections.map((connection) => [connection.connectionId, connection.name]),
      );
      const profiles = new Map(
        harness.profiles.map((profile) => [profile.profileId, profile.name]),
      );
      const controls = new Map(
        harness.controls.map((control) => [control.controlId, control.name]),
      );
      const pathways = new Map(
        harness.pathways.map((pathway) => [pathway.pathwayId, pathway.name]),
      );
      const container = document.createElement("div");
      const filter = document.createElement("input");
      const rows = document.createElement("div");
      container.className = "section-content";
      filter.className = "filter wire-filter";
      filter.type = "search";
      filter.placeholder = "Filter wires…";
      filter.setAttribute("aria-label", "Filter wires");
      filter.value = wireFilters.get(key) || "";
      filter.autocomplete = "off";
      rows.className = "wire-rows";
      const renderRows = () => {
        const wireFilter = filter.value.trim().toLocaleLowerCase();
        wireFilters.set(key, wireFilter);
        const wires = harness.wires.filter((wire) => {
          const searchable = [
            wire.wireNumber,
            connections.get(wire.startConnectionId),
            connections.get(wire.endConnectionId),
            profiles.get(wire.profileId),
          ].join(" ").toLocaleLowerCase();
          return searchable.includes(wireFilter);
        });
        rows.replaceChildren();
        if (!wires.length) {
          const text = harness.wires.length
            ? "No wires match this filter."
            : "No wires defined yet.";
          rows.append(emptyMessage(text));
          return;
        }
        wires.forEach((wire) => {
          const start = connections.get(wire.startConnectionId) || "Missing start";
          const end = connections.get(wire.endConnectionId) || "Missing destination";
          const profile = profiles.get(wire.profileId) || "Missing profile";
          const route = wire.orderedControlIds.length
            ? `Path: ${wire.orderedPathwayIds.map((id) => pathways.get(id) || "Missing pathway").join(" → ")} · Gates: ${wire.orderedControlIds.map((id) => controls.get(id) || "Missing control").join(" → ")}`
            : "Route: direct / not configured";
          rows.append(itemRow(`#${wire.wireNumber}  ${start} → ${end}`, profile, route));
        });
      };
      filter.addEventListener("input", renderRows);
      container.append(filter, rows);
      renderRows();
      return container;
    }

    function renderPathways(harness) {
      const controls = new Map(
        harness.controls.map((control) => [control.controlId, control]),
      );
      return definitionList(
        harness.pathways,
        (pathway) => {
          const route = pathway.orderedControlIds.length
            ? pathway.orderedControlIds.map((id) => {
              const control = controls.get(id);
              return control ? control.name : "Missing gate";
            }).join(" → ")
            : "No gates";
          return itemRow(pathway.name, pathway.routingMode, route);
        },
        "No pathways defined yet.",
      );
    }

    function renderEditor(harness) {
      ui.editor.replaceChildren();
      ui.addWires.disabled = harness.status === "damaged" || !harness.pathways?.length;
      ui.previewRoutes.disabled = harness.status === "damaged" || !harness.wires?.length;
      const heading = document.createElement("div");
      const title = document.createElement("h2");
      const meta = document.createElement("div");
      heading.className = "editor-heading";
      meta.className = "meta";
      title.textContent = harness.componentName;
      meta.textContent = harness.status === "damaged"
        ? "Damaged harness metadata"
        : `${harness.routingMode} · ${harness.status}`;
      heading.append(title, meta);
      ui.editor.append(heading);

      if (harness.status === "damaged") {
        const error = document.createElement("div");
        error.className = "error-panel";
        error.textContent = harness.error || "The stored definition could not be loaded.";
        ui.editor.append(error);
        return;
      }

      const overview = document.createElement("dl");
      const overviewRows = [
        ["Definition", harness.definitionName],
        ["Schema", harness.schemaVersion],
        ["Harness ID", harness.harnessId],
      ];
      overview.className = "overview";
      overviewRows.forEach(([label, value]) => {
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        term.textContent = label;
        description.textContent = value;
        overview.append(term, description);
      });
      ui.editor.append(overview);

      const connections = definitionList(
        harness.connections,
        (connection) => itemRow(
          connection.name,
          connection.hasLinkedGeometry ? "Geometry linked" : "Geometry missing",
        ),
        "No connections defined yet.",
      );
      const routing = definitionList(
        harness.controls,
        (control) => itemRow(
          control.name,
          control.kind.replaceAll("_", " "),
          control.hasLinkedGeometry ? "Geometry linked" : "Geometry missing",
        ),
        "No routing controls defined yet.",
      );
      const validation = document.createElement("div");
      validation.className = "section-content";
      if (harness.validationMessages.length) {
        const list = document.createElement("ul");
        list.className = "validation-list errors";
        harness.validationMessages.forEach((message) => {
          const item = document.createElement("li");
          item.textContent = message;
          list.append(item);
        });
        validation.append(list);
      } else {
        validation.append(emptyMessage("No logical validation findings."));
      }

      ui.editor.append(
        editorSection(
          "pathways",
          "Pathways",
          `${harness.pathways.length}`,
          renderPathways(harness),
          harness.pathways.length > 0,
        ),
        editorSection("wires", "Wires", `${harness.wires.length}`, renderWires(harness), true),
        editorSection("connections", "Connections", `${harness.connections.length}`, connections),
        editorSection("routing", "Routing", `${harness.controls.length}`, routing),
        editorSection(
          "validation",
          "Validation",
          harness.validationMessages.length ? `${harness.validationMessages.length} findings` : "Clear",
          validation,
          harness.validationMessages.length > 0,
        ),
      );
    }

    function openHarness(key) {
      const harness = currentState.harnesses.find((candidate) => harnessKey(candidate) === key);
      if (!harness) return;
      selectedHarnessKey = key;
      writeSession("wireBundler.selectedHarness", key);
      ui.libraryView.hidden = true;
      ui.editorView.hidden = false;
      renderEditor(harness);
      window.scrollTo(0, 0);
    }

    function closeEditor() {
      selectedHarnessKey = "";
      removeSession("wireBundler.selectedHarness");
      ui.editorView.hidden = true;
      ui.libraryView.hidden = false;
      ui.editor.replaceChildren();
      ui.harnessFilter.focus();
    }

    function render(state) {
      const scrollTop = document.scrollingElement.scrollTop;
      currentState = state;
      ui.notice.textContent = state.notice || "";
      renderLibrary();
      const selected = state.harnesses.find(
        (harness) => harnessKey(harness) === selectedHarnessKey,
      );
      if (selected) {
        ui.libraryView.hidden = true;
        ui.editorView.hidden = false;
        renderEditor(selected);
      } else {
        selectedHarnessKey = "";
        removeSession("wireBundler.selectedHarness");
        ui.editorView.hidden = true;
        ui.libraryView.hidden = false;
      }
      window.requestAnimationFrame(() => window.scrollTo(0, scrollTop));
    }

    function waitForFusionHost() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const timer = window.setInterval(() => {
          const fusionHost = window["adsk"];
          if (fusionHost && fusionHost.fusionSendData) {
            window.clearInterval(timer);
            resolve(fusionHost);
            return;
          }
          attempts += 1;
          if (attempts >= 50) {
            window.clearInterval(timer);
            reject(new Error("Fusion did not initialize the palette bridge."));
          }
        }, 100);
      });
    }

    async function send(action, payload = {}) {
      const fusionHost = await waitForFusionHost();
      const response = await fusionHost.fusionSendData(action, JSON.stringify(payload));
      return JSON.parse(response);
    }

    async function refresh() {
      try {
        ui.notice.style.color = "";
        render(await send("get_state"));
      } catch (error) {
        ui.notice.textContent = error.message;
        ui.notice.style.color = "var(--danger)";
      }
    }

    async function createHarness() {
      ui.notice.style.color = "";
      ui.notice.textContent = "Opening Create Harness…";
      try {
        const response = await send("create_harness");
        if (!response.ok) {
          ui.notice.textContent = response.error || "Create Harness could not be opened.";
          ui.notice.style.color = "var(--danger)";
        }
      } catch (error) {
        ui.notice.textContent = error.message;
        ui.notice.style.color = "var(--danger)";
      }
    }

    async function addPathway() {
      const harness = currentState.harnesses.find(
        (candidate) => harnessKey(candidate) === selectedHarnessKey,
      );
      if (!harness || harness.status === "damaged") return;
      ui.notice.style.color = "";
      ui.notice.textContent = "Opening Add Pathway…";
      try {
        const response = await send("add_pathway", { harnessId: harness.harnessId });
        if (!response.ok) {
          ui.notice.textContent = response.error || "Add Pathway could not be opened.";
          ui.notice.style.color = "var(--danger)";
        }
      } catch (error) {
        ui.notice.textContent = error.message;
        ui.notice.style.color = "var(--danger)";
      }
    }

    async function addWires() {
      const harness = currentState.harnesses.find(
        (candidate) => harnessKey(candidate) === selectedHarnessKey,
      );
      if (!harness || harness.status === "damaged" || !harness.pathways.length) return;
      ui.notice.style.color = "";
      ui.notice.textContent = "Opening Add Wires…";
      try {
        const response = await send("add_wires", { harnessId: harness.harnessId });
        if (!response.ok) {
          ui.notice.textContent = response.error || "Add Wires could not be opened.";
          ui.notice.style.color = "var(--danger)";
        }
      } catch (error) {
        ui.notice.textContent = error.message;
        ui.notice.style.color = "var(--danger)";
      }
    }

    async function previewRoutes() {
      const harness = currentState.harnesses.find(
        (candidate) => harnessKey(candidate) === selectedHarnessKey,
      );
      if (!harness || harness.status === "damaged" || !harness.wires.length) return;
      ui.notice.style.color = "";
      ui.notice.textContent = "Solving route preview…";
      try {
        const response = await send("preview_routes", { harnessId: harness.harnessId });
        if (!response.ok) {
          ui.notice.textContent = response.error || "Routes could not be previewed.";
          ui.notice.style.color = "var(--danger)";
        }
      } catch (error) {
        ui.notice.textContent = error.message;
        ui.notice.style.color = "var(--danger)";
      }
    }

    async function clearPreview() {
      ui.notice.style.color = "";
      try {
        const response = await send("clear_preview");
        if (!response.ok) {
          ui.notice.textContent = response.error || "Route preview could not be cleared.";
          ui.notice.style.color = "var(--danger)";
        }
      } catch (error) {
        ui.notice.textContent = error.message;
        ui.notice.style.color = "var(--danger)";
      }
    }

    ui.addPathway.addEventListener("click", addPathway);
    ui.addWires.addEventListener("click", addWires);
    ui.previewRoutes.addEventListener("click", previewRoutes);
    ui.clearPreview.addEventListener("click", clearPreview);
    ui.back.addEventListener("click", closeEditor);
    ui.create.addEventListener("click", createHarness);
    ui.createFromEditor.addEventListener("click", createHarness);
    ui.harnessFilter.addEventListener("input", renderLibrary);
    ui.refresh.addEventListener("click", refresh);
    window.fusionJavaScriptHandler = { handle(action, data) {
      if (action === "state") render(JSON.parse(data));
      return "OK";
    }};
    refresh();
  </script>
</body>
</html>
