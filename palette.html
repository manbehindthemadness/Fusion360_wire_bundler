          profileNode.addEventListener("click", () => openWireOptions(harness, wire, profile));
          materialNode.type = "button";
          materialNode.className = "route-node";
          materialNode.textContent = `${wire.materials.mainColor.name} ${wire.materials.insulationMaterial}`
            + `${wire.materials.stripes.length ? ` · ${wire.materials.stripes.length} stripes` : ""}`;
          materialNode.style.borderLeft = `8px solid ${wire.materials.mainColor.hex}`;
          materialNode.title = "Edit inherited and per-wire material options";
          materialNode.addEventListener("click", () => openMaterialOptions(harness, wire));
          details.append(
            renderWireRelationshipGraphic(harness, wire, connections, pathways),
            flow,
            profileNode,
            materialNode,
            endAEditor,
            endBEditor,
          );
          card.append(wireHeader(
            harness, wire, details, !start?.hasLinkedGeometry || !end?.hasLinkedGeometry,
          ), details);
          routes.append(card);
        });
      };
      filter.addEventListener("input", renderRoutes);
      container.append(filter, routes);
      renderRoutes();
      return container;
    }

    function relationshipAuditIssues(harness) {
      const projection = harness.relationshipMap || {};
      const issues = [...(projection.auditIssues || [])];
      const routes = new Map((projection.routes || []).map((route) => [route.wireId, route]));
      const occupancy = new Map(
        (projection.pathwayOccupancy || []).map((item) => [item.pathwayId, item.wireIds || []]),
      );
      const usage = new Map(
        (projection.connectionUsage || []).map((item) => [item.connectionId, item.endpoints || []]),
      );
      const addIssue = (code, message, memberType = "", memberId = "") => {
        if (!issues.some((issue) => issue.code === code && issue.memberId === memberId)) {
          issues.push({ code, message, memberType, memberId });
        }
      };
      harness.wires.forEach((wire) => {
        const route = routes.get(wire.wireId);
        const expectedNodes = [
          `connection:${wire.startConnectionId}`,
          ...wire.orderedPathwayIds.map((id) => `pathway:${id}`),
          `connection:${wire.endConnectionId}`,
        ];
        if (!route || JSON.stringify(route.nodeIds || []) !== JSON.stringify(expectedNodes)) {
          addIssue(
            "palette_wire_route_mismatch",
            `${wireLabel(wire)} does not match its master-graphic route.`,
            "wire",
            wire.wireId,
          );
        }
      });
      if (routes.size !== harness.wires.length) {
        addIssue(
          "palette_wire_count_mismatch",
          "Master graphic wire count disagrees with Wire Routes.",
        );
      }
      harness.pathways.forEach((pathway) => {
        const expected = harness.wires
          .filter((wire) => wire.orderedPathwayIds.includes(pathway.pathwayId))
          .map((wire) => wire.wireId);
        if (JSON.stringify(occupancy.get(pathway.pathwayId) || []) !== JSON.stringify(expected)) {
          addIssue(
            "palette_pathway_occupancy_mismatch",
            `${pathway.name} occupancy disagrees with Wire Routes.`,
            "pathway",
            pathway.pathwayId,
          );
        }
      });
      harness.connections.forEach((connection) => {
        const expected = [];
        harness.wires.forEach((wire) => {
          if (wire.startConnectionId === connection.connectionId) {
            expected.push(`${wire.wireId}:start`);
          }
          if (wire.endConnectionId === connection.connectionId) {
            expected.push(`${wire.wireId}:end`);
          }
        });
        const actual = (usage.get(connection.connectionId) || []).map(
          (endpoint) => `${endpoint.wireId}:${endpoint.end}`,
        );
        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
          addIssue(
            "palette_connection_usage_mismatch",
            `${connection.name} usage disagrees with Wire Routes.`,
            "connection",
            connection.connectionId,
          );
        }
      });
      return issues;
    }

    function svgElement(tag, attributes = {}) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, `${value}`));
      return node;
    }

    function truncateGraphicLabel(value, length = 22) {
      const text = value || "Unnamed";
      return text.length > length ? `${text.slice(0, length - 1)}…` : text;
    }

    function navigateToWire(wireId) {
      const section = ui.editor.querySelector('[data-section="wire-routes"]');
      const card = ui.editor.querySelector(`[data-wire-id="${wireId}"]`);
      if (section) {
        section.open = true;
        expandedSections.add("wire-routes");
      }
      if (!card) return;
      const details = card.querySelector(".wire-details");
      if (details) details.hidden = false;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function renderWireRelationshipGraphic(harness, wire, connections, pathways) {
      const container = document.createElement("div");
      const nodeItems = [
        {
          kind: "connection",
          label: wire.startEndName
            || connections.get(wire.startConnectionId)?.name
            || "Missing End A",
          missing: !connections.has(wire.startConnectionId),
        },
        ...wire.orderedPathwayIds.map((pathwayId) => ({
          kind: "pathway",
          label: pathways.get(pathwayId)?.name || "Missing pathway",
          missing: !pathways.has(pathwayId),
        })),
        {
          kind: "connection",
          label: wire.endEndName
            || connections.get(wire.endConnectionId)?.name
            || "Missing End B",
          missing: !connections.has(wire.endConnectionId),
        },
      ];
      const width = Math.max(560, 100 + (nodeItems.length - 1) * 180);
      const y = 44;
      const startX = 70;
      const step = (width - 140) / Math.max(1, nodeItems.length - 1);
      const points = nodeItems.map((_item, index) => startX + index * step);
      const svg = svgElement("svg", {
        class: "relationship-map-svg",
        width,
        height: 88,
        viewBox: `0 0 ${width} 88`,
        role: "img",
        "aria-label": `${wireLabel(wire)} relationship route`,
      });
      for (let index = 0; index < points.length - 1; index += 1) {
        svg.append(svgElement("line", {
          class: "relationship-link",
          x1: points[index], y1: y, x2: points[index + 1], y2: y,
          stroke: wire.materials?.mainColor?.hex || "#1777c8", "stroke-width": 9,
        }));
        (wire.materials?.stripes || []).slice(0, 3).forEach((stripe, stripeIndex) => {
          svg.append(svgElement("line", {
            class: "relationship-link",
            x1: points[index], y1: y - 3 + stripeIndex * 3,
            x2: points[index + 1], y2: y - 3 + stripeIndex * 3,
            stroke: stripe.color?.hex || "#fff", "stroke-width": 1.7,
            "stroke-dasharray": stripe.pattern === "solid" ? "none" : "8 5",
          }));
        });
      }
      nodeItems.forEach((item, index) => {
        const x = points[index];
        const shape = item.kind === "pathway"
          ? svgElement("rect", {
            class: `relationship-node pathway${item.missing ? " missing" : ""}`,
            x: x - 75, y: y - 18, width: 150, height: 36, rx: 18,
          })
          : svgElement("rect", {
            class: `relationship-node connection${item.missing ? " missing" : ""}`,
            x: x - 52, y: y - 16, width: 104, height: 32, rx: 7,
          });
        const label = svgElement("text", { class: "relationship-node-label", x, y: y + 3 });
        const kind = svgElement("text", { class: "relationship-node-kind", x, y: y - 22 });
        const title = svgElement("title");
        label.textContent = truncateGraphicLabel(item.label, item.kind === "pathway" ? 21 : 18);
        kind.textContent = item.kind;
        title.textContent = `${item.kind}: ${item.label}`;
        shape.append(title);
        svg.append(shape, label, kind);
      });
      container.className = "wire-relationship-graphic";
      hoverHighlight(container, () => highlightMember(harness, "preview_wire", wire.wireId));
      container.append(svg);
      return container;
    }

    function relationshipEndGroups(harness, pathway, endpoint, connections) {
      const connectionField = endpoint === "start" ? "startConnectionId" : "endConnectionId";
      const endpointNameField = endpoint === "start" ? "startEndName" : "endEndName";
      const groups = new Map();
      harness.wires
        .filter((wire) => wire.orderedPathwayIds.includes(pathway.pathwayId))
        .forEach((wire) => {
          const connectionId = wire[connectionField] || "";
          const groupKey = connectionId || `missing:${wire.wireId}`;
          if (!groups.has(groupKey)) {
            groups.set(groupKey, {
              connectionId,
              connectionName: connections.get(connectionId)?.name || "",
              endpointNames: new Set(),
              wires: [],
            });
          }
          const group = groups.get(groupKey);
          if (wire[endpointNameField]) group.endpointNames.add(wire[endpointNameField]);
          group.wires.push(wire);
        });
      return [...groups.values()].map((group) => {
        const endpointNames = [...group.endpointNames];
        const label = endpointNames.length === 1
          ? endpointNames[0]
          : group.connectionName || `Missing End ${endpoint === "start" ? "A" : "B"}`;
        const wireSearch = group.wires.map((wire) => (
          `${wireLabel(wire)} ${wire.wireNumber} ${wire.materials?.insulationMaterial || ""} ${wire.materials?.mainColor?.name || ""}`
        )).join(" ");
        return {
          ...group,
          label,
          searchable: `${label} ${group.connectionName} ${endpointNames.join(" ")} ${wireSearch}`
            .toLocaleLowerCase(),
        };
      });
    }

    function renderRelationshipConnector(connectionCount, fromEndList, expanded) {
      const svg = svgElement("svg", {
        class: "relationship-connector",
        viewBox: "0 0 54 100",
        preserveAspectRatio: "none",
        "aria-hidden": "true",
      });
      const redraw = (isExpanded) => {
        svg.replaceChildren();
        const curveCount = connectionCount ? (isExpanded ? connectionCount : 1) : 0;
        for (let index = 0; index < curveCount; index += 1) {
          const listY = isExpanded
            ? 20 + 75 * ((index + 0.5) / curveCount)
            : 50;
          const pathData = fromEndList
            ? `M 0 ${listY} C 24 ${listY}, 30 50, 54 50`
            : `M 0 50 C 24 50, 30 ${listY}, 54 ${listY}`;
          svg.append(svgElement("path", { d: pathData }));
        }
      };
      svg.redraw = redraw;
      redraw(expanded);
      return svg;
    }

    function renderRelationshipEndList(
      harness, pathway, endpoint, groups, visibleGroups, query, collapseLimit,
    ) {
      const side = endpoint === "start" ? "A" : "B";
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      const count = document.createElement("span");
      const items = document.createElement("div");
      const overrideKey = `${harnessKey(harness)}:${pathway.pathwayId}:${endpoint}`;
      const override = relationshipEndListOverrides.get(overrideKey);
      details.className = "relationship-end-list";
      details.dataset.endpoint = endpoint;
      details.open = query
        ? visibleGroups.length > 0
        : override ?? groups.length <= collapseLimit;
      label.textContent = `End ${side}`;
      count.textContent = query && visibleGroups.length !== groups.length
        ? `${visibleGroups.length} of ${groups.length}`
        : `${groups.length}`;
      summary.append(label, count);
      hoverHighlight(summary, () => highlightMember(harness, "pathway_wires", pathway.pathwayId));
      items.className = "relationship-end-items";
      visibleGroups.forEach((group) => {
        const button = document.createElement("button");
        const name = document.createElement("strong");
        const meta = document.createElement("small");
        button.type = "button";
        button.className = "relationship-end-entry";
        button.dataset.connectionId = group.connectionId;
        name.textContent = group.label;
        const connectionContext = group.connectionName && group.connectionName !== group.label
          ? `${group.connectionName} · ` : "";
        meta.textContent = `${connectionContext}${group.wires.length} ${group.wires.length === 1 ? "wire" : "wires"}`;
        button.append(name, meta);
        hoverHighlight(button, () => group.connectionId
          ? highlightMember(harness, "connection", group.connectionId)
          : highlightMember(harness, "preview_wire", group.wires[0].wireId));
        button.addEventListener("click", () => navigateToWire(group.wires[0].wireId));
        items.append(button);
      });
      if (!visibleGroups.length) items.append(emptyMessage(`No matching End ${side} connections.`));
      details.addEventListener("toggle", () => {
        if (!query) relationshipEndListOverrides.set(overrideKey, details.open);
        if (details.redrawConnector) details.redrawConnector(details.open);
      });
      details.append(summary, items);
      return details;
    }

    function renderRelationshipMap(harness, auditIssues) {
      const connections = new Map(
        harness.connections.map((connection) => [connection.connectionId, connection]),
      );
      const container = document.createElement("div");
      const toolbar = document.createElement("div");
      const filter = document.createElement("input");
      const summary = document.createElement("span");
      const settings = document.createElement("label");
      const collapseInput = document.createElement("input");
      const viewport = document.createElement("div");
      container.className = "section-content relationship-map";
      toolbar.className = "relationship-map-toolbar";
      filter.className = "filter";
      filter.type = "search";
      filter.placeholder = "Find a wire, connection, or pathway…";
      filter.setAttribute("aria-label", "Filter master relationship graphic");
      filter.autocomplete = "off";
      filter.value = relationshipFilters.get(harnessKey(harness)) || "";
      summary.className = "relationship-map-summary";
      summary.textContent = auditIssues.length ? `${auditIssues.length} cross-check findings` : "Cross-check clear";
      toolbar.append(filter, summary);
      settings.className = "relationship-map-settings";
      settings.textContent = "Collapse end lists above";
      collapseInput.type = "number";
      collapseInput.min = `${MIN_RELATIONSHIP_COLLAPSE_LIMIT}`;
      collapseInput.max = `${MAX_RELATIONSHIP_COLLAPSE_LIMIT}`;
      collapseInput.step = "1";
      collapseInput.value = `${relationshipCollapseLimit(harness)}`;
      collapseInput.setAttribute("aria-label", "Connections before end lists collapse");
      settings.append(collapseInput, "connections");
      viewport.className = "relationship-map-viewport";

      const draw = () => {
        const query = filter.value.trim().toLocaleLowerCase();
        const collapseLimit = clampRelationshipCollapseLimit(collapseInput.value);
        relationshipFilters.set(harnessKey(harness), query);
        viewport.replaceChildren();
        const stack = document.createElement("div");
        let visiblePathways = 0;
        stack.className = "relationship-pathway-stack";
        harness.pathways.forEach((pathway) => {
          const startGroups = relationshipEndGroups(harness, pathway, "start", connections);
          const endGroups = relationshipEndGroups(harness, pathway, "end", connections);
          const pathwayMatches = `${pathway.name} ${pathway.startName || ""} ${pathway.endName || ""}`
            .toLocaleLowerCase().includes(query);
          const visibleStart = !query || pathwayMatches
            ? startGroups : startGroups.filter((group) => group.searchable.includes(query));
          const visibleEnd = !query || pathwayMatches
            ? endGroups : endGroups.filter((group) => group.searchable.includes(query));
          if (query && !pathwayMatches && !visibleStart.length && !visibleEnd.length) return;
          const card = document.createElement("div");
          const hub = document.createElement("button");
          const hubName = document.createElement("strong");
          const hubDirection = document.createElement("small");
          const startList = renderRelationshipEndList(
            harness, pathway, "start", startGroups, visibleStart, query, collapseLimit,
          );
          const endList = renderRelationshipEndList(
            harness, pathway, "end", endGroups, visibleEnd, query, collapseLimit,
          );
          const startConnector = renderRelationshipConnector(
            visibleStart.length, true, startList.open,
          );
          const endConnector = renderRelationshipConnector(
            visibleEnd.length, false, endList.open,
          );
          card.className = "relationship-pathway-card";
          card.dataset.pathwayId = pathway.pathwayId;
          hub.type = "button";
          hub.className = "relationship-pathway-hub";
          hubName.textContent = pathway.name || "Unnamed pathway";
          hubDirection.textContent = pathwayDirection(pathway);
          hub.append(hubName, hubDirection);
          hoverHighlight(hub, () => highlightMember(harness, "pathway", pathway.pathwayId));
          startList.redrawConnector = startConnector.redraw;
          endList.redrawConnector = endConnector.redraw;
          card.append(startList, startConnector, hub, endConnector, endList);
          stack.append(card);
          visiblePathways += 1;
        });
        if (!visiblePathways) {
          const message = emptyMessage(
            harness.pathways.length
              ? "No relationships match this filter."
              : "No pathways to display yet.",
          );
          message.className = "empty relationship-map-empty";
          viewport.append(message);
          return;
        }
        viewport.append(stack);
      };
      filter.addEventListener("input", draw);
      collapseInput.addEventListener("change", () => {
        const limit = clampRelationshipCollapseLimit(collapseInput.value);
        collapseInput.value = `${limit}`;
        writeSession(relationshipCollapseStorageKey(harness), `${limit}`);
        [...relationshipEndListOverrides.keys()]
          .filter((key) => key.startsWith(`${harnessKey(harness)}:`))
          .forEach((key) => relationshipEndListOverrides.delete(key));
        draw();
      });
      container.append(toolbar, settings, viewport);
      draw();
      return container;
    }

    function renderEditor(harness) {
      ui.editor.replaceChildren();
      ui.generateSolids.disabled = harness.status === "damaged" || !harness.wires?.length;
      ui.defaults.disabled = harness.status === "damaged";
      ui.materialDefaults.disabled = harness.status === "damaged";
      ui.addWires.disabled = harness.status === "damaged" || !harness.pathways?.length;
      ui.previewRoutes.disabled = harness.status === "damaged" || !harness.wires?.length;
      const heading = document.createElement("div");
      const title = document.createElement("h2");
      const meta = document.createElement("div");
      heading.className = "editor-heading";
      meta.className = "meta";
      title.textContent = harness.componentName;
      meta.textContent = harness.status === "damaged"
        ? "Damaged harness metadata"
        : `${harness.routingMode} · ${harness.status}`;
      heading.append(title, meta);
      ui.editor.append(heading);

      if (harness.status === "damaged") {
        const error = document.createElement("div");
        error.className = "error-panel";
        error.textContent = harness.error || "The stored definition could not be loaded.";
        ui.editor.append(error);
        return;
      }

      const overview = document.createElement("dl");
      const overviewRows = [
        ["Definition", harness.definitionName],
        ["Schema", harness.schemaVersion],
        ["Harness ID", harness.harnessId],
      ];
      overview.className = "overview";
      overviewRows.forEach(([label, value]) => {
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        term.textContent = label;
        description.textContent = value;
        overview.append(term, description);
      });
      ui.editor.append(overview);

      const validation = document.createElement("div");
      const auditIssues = relationshipAuditIssues(harness);
      const audit = document.createElement("div");
      validation.className = "section-content";
      audit.className = `relationship-audit${auditIssues.length ? " findings" : ""}`;
      audit.textContent = auditIssues.length
        ? `Relationship cross-check found ${auditIssues.length} ${auditIssues.length === 1 ? "inconsistency" : "inconsistencies"}.`
        : "Relationship cross-check agrees with wire routes, pathway occupancy, and connection usage.";
      validation.append(audit);
      if (harness.validationMessages.length) {
        const list = document.createElement("ul");
        list.className = "validation-list errors";
        harness.validationMessages.forEach((message) => {
          const item = document.createElement("li");
          item.textContent = String(message);
          list.append(item);
        });
        validation.append(list);
      } else {
        validation.append(emptyMessage("No logical validation findings."));
      }
      if (auditIssues.length) {
        const list = document.createElement("ul");
        list.className = "validation-list errors";
        auditIssues.forEach((issue) => {
          const item = document.createElement("li");
          item.textContent = issue.message;
          if (issue.memberType && issue.memberId) {
            hoverHighlight(item, () => highlightMember(
              harness,
              issue.memberType === "wire" ? "preview_wire" : issue.memberType,
              issue.memberId,
            ));
          }
          list.append(item);
        });
        validation.append(list);
      }

      const findingCount = harness.validationMessages.length + auditIssues.length;

      ui.editor.append(
        editorSection(
          "wire-routes",
          "Wire Routes",
          `${harness.wires.length}`,
          renderWireRoutes(harness),
          false,
        ),
        editorSection(
          "pathways",
          "Pathways & Occupancy",
          `${harness.pathways.length}`,
          renderPathways(harness),
          false,
        ),
        editorSection(
          "validation",
          "Validation",
          findingCount ? `${findingCount} findings` : "Clear",
          validation,
          findingCount > 0,
        ),
        editorSection(
          "master-relationship-graphic",
          "Master Relationship Graphic",
          auditIssues.length ? `${auditIssues.length} findings` : `${harness.pathways.length} pathways`,
          renderRelationshipMap(harness, auditIssues),
          true,
        ),
      );
    }

    function openHarness(key) {
      const harness = currentState.harnesses.find((candidate) => harnessKey(candidate) === key);
      if (!harness) return;
      selectedHarnessKey = key;
      writeSession("wireBundler.selectedHarness", key);
      ui.libraryView.hidden = true;
      ui.editorView.hidden = false;
      renderEditor(harness);
      window.scrollTo(0, 0);
    }

    function closeEditor() {
      send("clear_highlight").catch(() => {});
      selectedHarnessKey = "";
      removeSession("wireBundler.selectedHarness");
      ui.editorView.hidden = true;
      ui.libraryView.hidden = false;
      ui.editor.replaceChildren();
      ui.harnessFilter.focus();
    }

    function render(state) {
      const scrollTop = document.scrollingElement.scrollTop;
      currentState = state;
      appendNotice(state.notice);
      renderLibrary();
      const selected = state.harnesses.find(
        (harness) => harnessKey(harness) === selectedHarnessKey,
      );
      if (selected) {
        ui.libraryView.hidden = true;
        ui.editorView.hidden = false;
        renderEditor(selected);
      } else {
        selectedHarnessKey = "";
        removeSession("wireBundler.selectedHarness");
        ui.editorView.hidden = true;
        ui.libraryView.hidden = false;
      }
      window.requestAnimationFrame(() => window.scrollTo(0, scrollTop));
    }

    function appendNotice(message, isError = false) {
      if (!message) return;
      const previous = ui.notice.children[ui.notice.children.length - 1];
      if (previous?.textContent === message && previous.className.includes(isError ? "error" : "notice-entry")) return;
      const entry = document.createElement("div");
      entry.className = `notice-entry${isError ? " error" : ""}`;
      entry.textContent = message;
      ui.notice.append(entry);
      ui.notice.scrollTop = ui.notice.scrollHeight;
    }

    function waitForFusionHost() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const timer = window.setInterval(() => {
          const fusionHost = window["adsk"];
          if (fusionHost && fusionHost.fusionSendData) {
            window.clearInterval(timer);
            resolve(fusionHost);
            return;
          }
          attempts += 1;
          if (attempts >= 50) {
            window.clearInterval(timer);
            reject(new Error("Fusion did not initialize the palette bridge."));
          }
        }, 100);
      });
    }

    async function send(action, payload = {}) {
      const fusionHost = await waitForFusionHost();
      const response = await fusionHost.fusionSendData(action, JSON.stringify(payload));
      return JSON.parse(response);
    }

    function generateSolids() {
      const harness = currentState.harnesses.find((item) => harnessKey(item) === selectedHarnessKey);
      if (!harness || harness.status === "damaged" || !harness.wires?.length) return;
      if (!window.confirm("Build wire solids? This replaces previous generated wire components, including manual edits inside them.")) return;
      return mutate("generate_solids", { harnessId: harness.harnessId, replaceExisting: true }, "Generating wire solids…");
    }

    function clearSolids() {
      const harness = currentState.harnesses.find((item) => harnessKey(item) === selectedHarnessKey);
      if (!harness || harness.status === "damaged") return;
      if (!window.confirm("Clear generated wire solids? This removes manual edits inside generated wire components.")) return;
      return mutate("clear_solids", { harnessId: harness.harnessId }, "Clearing wire solids…");
    }

    async function refresh() {
      try {
        render(await send("get_state"));
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    async function createHarness() {
      appendNotice("Opening Create Harness…");
      try {
        const response = await send("create_harness");
        if (!response.ok) {
          appendNotice(response.error || "Create Harness could not be opened.", true);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    async function mutate(action, payload, progress) {
      appendNotice(progress);
      try {
        const response = await send(action, payload);
        if (!response.ok) {
          appendNotice(response.error || "The harness edit could not be completed.", true);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    async function highlightMember(harness, memberType, memberId, extra = {}) {
      try {
        const response = await send("highlight_member", {
          harnessId: harness.harnessId,
          memberType,
          memberId,
          ...extra,
        });
        if (!response.ok) {
          appendNotice(response.error || "Linked geometry could not be highlighted.", true);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    async function appendPathwayGates(harness, pathway) {
      appendNotice(`Selecting additional gates for ${pathway.name}…`);
      try {
        const response = await send("append_pathway_gates", {
          harnessId: harness.harnessId,
          pathwayId: pathway.pathwayId,
        });
        if (!response.ok) {
          appendNotice(response.error || "Add Gates could not be opened.", true);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    function removeGate(harness, pathway, controlId, name) {
      if (!window.confirm(`Remove ${name} from ${pathway.name}?`)) return;
      mutate(
        "remove_pathway_gate",
        { harnessId: harness.harnessId, pathwayId: pathway.pathwayId, controlId },
        "Removing gate…",
      );
    }

    function removeWirePair(harness, wire) {
      if (!window.confirm(`Remove wire #${wire.wireNumber} and both connection assignments?`)) return;
      mutate(
        "remove_wire",
        { harnessId: harness.harnessId, wireId: wire.wireId },
        `Removing wire #${wire.wireNumber}…`,
      );
    }

    async function addPathway() {
      const harness = currentState.harnesses.find(
        (candidate) => harnessKey(candidate) === selectedHarnessKey,
      );
      if (!harness || harness.status === "damaged") return;
      appendNotice("Opening Add Pathway…");
      try {
        const response = await send("add_pathway", { harnessId: harness.harnessId });
        if (!response.ok) {
          appendNotice(response.error || "Add Pathway could not be opened.", true);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    async function addWires(pathwayId = null) {
      const harness = currentState.harnesses.find(
        (candidate) => harnessKey(candidate) === selectedHarnessKey,
      );
      if (!harness || harness.status === "damaged" || !harness.pathways.length) return;
      appendNotice("Opening Add Wires…");
      try {
        const response = await send("add_wires", { harnessId: harness.harnessId, pathwayId });
        if (!response.ok) {
          appendNotice(response.error || "Add Wires could not be opened.", true);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    async function previewRoutes() {
      const harness = currentState.harnesses.find(
        (candidate) => harnessKey(candidate) === selectedHarnessKey,
      );
      if (!harness || harness.status === "damaged" || !harness.wires.length) return;
      appendNotice("Solving route preview…");
      try {
        const response = await send("preview_routes", { harnessId: harness.harnessId });
        if (!response.ok) {
          appendNotice(response.error || "Routes could not be previewed.", true);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    async function clearPreview() {
      try {
        const response = await send("clear_preview");
        if (!response.ok) {
          appendNotice(response.error || "Route preview could not be cleared.", true);
        } else {
          appendNotice(response.notice);
        }
      } catch (error) {
        appendNotice(error.message, true);
      }
    }

    ui.addPathway.addEventListener("click", addPathway);
    ui.addWires.addEventListener("click", () => addWires());
    ui.defaults.addEventListener("click", () => {
      const harness = currentState.harnesses.find((item) => harnessKey(item) === selectedHarnessKey);
      if (harness && harness.status !== "damaged") openInterpolationOptions(harness, "defaults");
    });
    ui.materialDefaults.addEventListener("click", () => {
      const harness = currentState.harnesses.find((item) => harnessKey(item) === selectedHarnessKey);
      if (harness && harness.status !== "damaged") openMaterialOptions(harness);
    });
    ui.generateSolids.addEventListener("click", generateSolids);
    ui.clearSolids.addEventListener("click", clearSolids);
    ui.previewRoutes.addEventListener("click", previewRoutes);
    ui.clearPreview.addEventListener("click", clearPreview);
    ui.back.addEventListener("click", closeEditor);
    ui.create.addEventListener("click", createHarness);
    ui.createFromEditor.addEventListener("click", createHarness);
    ui.harnessFilter.addEventListener("input", renderLibrary);
    ui.refresh.addEventListener("click", refresh);
    window.fusionJavaScriptHandler = { handle(action, data) {
      if (action === "state") render(JSON.parse(data));
      return "OK";
    }};
    refresh();
  </script>
</body>
</html>
